services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      # Matches CI's postgres service container (.github/workflows/ci.yml)
      # and story_simulator/config.py's DEFAULT_DATABASE_DSN, just with
      # "db" (this compose network's service name) instead of "localhost".
      STORY_SIM_DATABASE_DSN: postgresql://postgres:postgres@db:5432/postgres
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
