world:
    - description: >
        The world in this setting is designed to iteratively build history.
        
        The core gimmick is that there is a door, and every time the player walks
        through the door they find themselves walking through a new door one year in the
        future and a set distance south of the door. The set distance starts at 1 km
        south and then increments by 1 more km each time the player walks through the
        door. So the first time they walk through the door they will be 1 km south then
        the second time they walk through the door they will be 2 km south from the
        first door, i.e. 1 km south from the door they came out of the first time.

        This builds up history by having the player retrace the same area over and over,
        with the objects from before now present. Each time they walk through the door
        the world will generate the terrain for one more kilometer, and advance time
        one year in the existing area.

player:
    - character:
        interaction_type: player
    - position:
        x: 0
        y: 0
    - origin
    - description:
        value: A traveler, pausing at the edge of a quiet space.

door:
    - object:
        type: door
    - position:
        x: 0
        y: 2
    - description:
        value: A plain door; what's on its far side isn't visible yet.

expanse:
    - object:
        type: expanse
    - position:
        x: 0
        y: 0
    - description:
        value: An empty, quiet space, without walls or horizon.

journaling_desk:
    data:
        - note: >
            The journaling desk is chosen to be firmly at a distance where the player
            can no longer see the door, i.e. the door takes up <=1% of their field of
            view.  The standard field of view is 60 degrees, so we're looking at an
            angular size of 0.6 degrees. The relationship between angular size,
            distance, and height is roughly tan(ang_size) = height / distance, so for an
            average door of height 2 meters (standard) the distance comes out to
            2 m / tan(0.6 degrees) = 2 m / 0.01 = 200 m. 500 m is plenty safe.
    journal:
        - object:
            type: journal
        - position:
            x: 0
            y: 500
        - description: >
            A piece of leather bent in half around a small booklet of lined paper.
            It rests on top of the desk and next to a pen.
        - writing:
            value: "Leave a note."
    pen:
        - object:
            type: pen
        - position:
            x: 0
            y: 500
        - description: >
            A capped fountain pen, jade green and faceted with a wide nib. The ink is
            black. It rests next to a journal and on a desk.
    desk:
        - object:
            type: desk
        - position:
            x: 0
            y: 500
        - description: >
            A solid desk made of a deep reddish-brown wood.

