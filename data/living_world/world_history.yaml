- description: Packed dirt cracked in a spiderweb pattern from drought. Sparse, yellowed
    grass tufts push up through the gaps, and the air smells of dust and something
    organic long since dried out. The land is flat and featureless in every direction,
    with a high, harsh sun and sharp-edged shadows -- the light of late spring or
    early summer.
world:
- description: 'The world in this setting is designed to iteratively build history.

    The core gimmick is that there is a door, and every time the player walks through
    the door they find themselves walking through a new door one year in the future
    and a set distance south of the door. The set distance starts at 1 km south and
    then increments by 1 more km each time the player walks through the door. So the
    first time they walk through the door they will be 1 km south then the second
    time they walk through the door they will be 2 km south from the first door, i.e.
    1 km south from the door they came out of the first time.

    This builds up history by having the player retrace the same area over and over,
    with the objects from before now present. Each time they walk through the door
    the world will generate the terrain for one more kilometer, and advance time one
    year in the existing area.'
- note: 'Door mechanic clarification: only the original door (alias "door") carries
    the teleport-forward mechanic (one year forward, one more km south each time the
    player walks through it). Doors encountered afterward at each stop (door_2, door_3,
    ...) are ordinary, non-magical doors -- part of the accumulated scenery/history
    of that stop, not triggers themselves. To advance again, the player must travel
    back to the original door and walk through it again. Door crossings of the original
    door so far: 1.

    '
- note: 'Door crossings so far: 1. The player is now 1 km south of the original door
    and one year after the story''s start.

    '
