file_info:
    - description: >
          story-simulator's "how chain": start at the mission and keep
          asking how it gets done, one entity per answer, until the answers
          are real files. how_detail.yaml (generated by
          scripts/generate_how_detail.py) continues below the file level to
          every object: each file, class, or function to the classes and
          functions defined in it, and each file or class to its variables.
          Same format as iacs's poc/how_chain (branch
          claude/emc2p-why-chain-experiment-9ex21s).

          Deliberately not broken down further: function-local variables,
          ``__iacs__`` metadata, ``if __name__ == "__main__"`` guards, the
          entities inside world/scenario YAML files (seed data, not code;
          the same names, e.g. car_a, recur across scenarios), and repo
          config files (.mcp.json, .vscode/, ...).

          Each step down is a ((how)) link owned by the more abstract
          entity, whose ``value`` is the more concrete one. Above the file
          level the asking side is always a hand-written concept entity in
          this file. Python files are referenced by their real module
          entities, so their descriptions come from their own docstrings.
          Non-Python files (the world schema, seed data, shell hooks,
          main.py) aren't loadable entities, so each gets a small stand-in
          entity here with a ((source_file)) component naming its path.

          Load with:
          Registrar.from_manifest(["docs/how_chain", "story_simulator", "tests", "scripts"])
    - file_info

how:
    - description: >
          A link from an entity to one of the concrete entities that is how
          it gets achieved. The owner asks "how does this get done?" and
          ``value`` is one answer, one step more concrete.
    - parent: directed_relation
    - field:
          value:
              description: The entity that is how the owner gets achieved.
              type: entity_ref
          question:
              description: The "how" question this link answers, from the owner's point of view.
              type: str
          note:
              description: Optional side note about this link.
              type: str
              nullable: true

source_file:
    - description: >
          Repo-relative path (or ``path::name`` for one top-level YAML
          definition) of a non-Python file a stand-in entity represents.
    - field:
          value:
              description: The path.
              type: str

# ---------------------------------------------------------------------------
# Root, then the function/quality split
# ---------------------------------------------------------------------------

how_chain_mission:
    - description: >
          Enable players to create and experience self-consistent stories,
          with simulation mechanics handled by AI.
    - how:
          - value: function
            question: What does story-simulator do to deliver this?
          - value: quality
            question: How do we make sure it does that well?

function:
    - description: What story-simulator does at runtime.
    - how:
          - value: ai_game_master_interface
            question: How do characters act in the story?
          - value: world_state
            question: How is the world remembered consistently?
          - value: event_driven_simulation
            question: How do events unfold over time?
          - value: ai_judgment
            question: How does AI decide what happens?

quality:
    - description: How the project checks and maintains itself.
    - how:
          - value: verification
            question: How do we know it works?
          - value: development_tooling
            question: How is development kept on track?

# ---------------------------------------------------------------------------
# Function
# ---------------------------------------------------------------------------

ai_game_master_interface:
    - description: Characters (the player's included) act through an MCP-aware agent acting as game master; story-simulator gives it tools.
    - how:
          - value: story_simulator.mcp_server
            question: How does the AI host call in?
          - value: story_simulator.__init__
            question: How is the package importable?

world_state:
    - description: A typed, Postgres-backed registry with full history, not the model's context.
    - how:
          - value: world_schema
            question: What facts can a world hold?
          - value: starting_scenarios
            question: How do worlds start and persist?
          - value: story_simulator.config
            question: How does each save find its database?
            note: Also holds the responder settings ai_judgment uses.

event_driven_simulation:
    - description: Pop the soonest event, resolve it, plan what follows; pause when only the host can answer.
    - how:
          - value: story_simulator.core
            question: Where does the event loop live?

ai_judgment:
    - description: Each resolve/plan step is answered by the host, its subagent, or an in-process keyed subagent.
    - how:
          - value: story_simulator.resolve
            question: How does a judgment call reach a responder and resume?
          - value: story_simulator.keyed_subagent
            question: How can AI answer without a host round trip?

# ---------------------------------------------------------------------------
# Quality
# ---------------------------------------------------------------------------

verification:
    - description: Fast logic tests, slow database-backed tests, live-model tests, and human-validated scenarios.
    - how:
          - value: test_infrastructure
            question: What do the tests share?
          - value: tool_surface_tests
            question: How are the MCP tools checked?
          - value: simulation_tests
            question: How is the event loop checked?
          - value: judgment_tests
            question: How are the responders checked?
          - value: human_validated_tests
            question: How are whole play scenarios checked?
          - value: project_tooling_tests
            question: How are the manifest and git hooks checked?

development_tooling:
    - description: Scripts and hooks used while developing, not at runtime.
    - how:
          - value: check_docstrings_hook
            question: How are docstring edits flagged for review?
          - value: check_pr_size_hook
            question: How are PRs kept reviewable?
          - value: scripts.get_usage
            question: How is usage cost measured?
          - value: scripts.generate_how_detail
            question: How does this chain stay in sync with the code?
          - value: root_main_py
            question: What is main.py?

# ---------------------------------------------------------------------------
# Level 2: world content
# ---------------------------------------------------------------------------

world_schema:
    - description: The world schema, merged into every world registry.
    - source_file: manifest/builtins.yaml
    - how:
          - value: schema_character
            question: How is a character represented?
          - value: schema_object
            question: How is an object represented?
          - value: schema_appearance
            question: How is an entity's look recorded?
          - value: schema_state
            question: How is an entity's current status recorded?
          - value: schema_location
            question: How is an entity's whereabouts recorded?
          - value: schema_physics_components
            question: How are physical properties recorded?
          - value: schema_character_components
            question: How are character-specific facts recorded?
          - value: schema_turn_components
            question: How are turns recorded?
          - value: schema_event_components
            question: How are scheduled happenings represented?
          - value: schema_agent_components
            question: How are agents recorded in the world?

starting_scenarios:
    - description: A save is a seed scenario plus exported world/ and world_history/ directories.
    - how:
          - value: default_scenario
            question: What does a world start from by default?
          - value: living_world
            question: Where is the long-running playthrough?

living_world:
    - description: A real playthrough's committed save; continue it, don't use it as a template.
    - source_file: data/living_world
    - how:
          - value: living_world_scenario
            question: What did it start from?
          - value: living_world_current
            question: What is its current state?
          - value: living_world_history
            question: What is its full history?

# ---------------------------------------------------------------------------
# Level 2: test groups
# ---------------------------------------------------------------------------

test_infrastructure:
    - description: Shared fixtures and package markers for the suite.
    - how:
          - value: tests.conftest
            question: What do the top-level tests share?
          - value: test_human_validated.__init__
            question: How are the human-validated tests packaged?

tool_surface_tests:
    - description: Tests of the MCP server's tools against real opened worlds.
    - how:
          - value: tests.test_mcp_server
            question: How are the tools checked against real worlds?

simulation_tests:
    - description: Tests of the event-driven simulation kernel.
    - how:
          - value: tests.test_core
            question: How are kernel pieces checked?
          - value: tests.test_event_loop
            question: How is the full resolve/plan loop checked?

judgment_tests:
    - description: Tests of the judgment resolver and responders.
    - how:
          - value: tests.test_resolve
            question: How are replay and dispatch checked?
          - value: tests.test_keyed_subagent
            question: How is the in-process keyed subagent checked?
          - value: tests.test_native_subagent_sidechain
            question: How are delegated subagent turns found afterwards?

human_validated_tests:
    - description: Whole scenarios with person-validated outcomes, run scripted and live.
    - how:
          - value: test_human_validated.conftest
            question: What fixtures do scenarios share?
          - value: test_human_validated.helpers
            question: What helpers do scenarios share?
          - value: test_human_validated.test_conftest_fixtures
            question: How are those fixtures checked?
          - value: test_scenarios.__init__
            question: How are the scenarios packaged?
          - value: parking_scenario
            question: How is the parking scenario checked?
          - value: race_scenario
            question: How is the race scenario checked?
          - value: location_write_isolated.test_responder_matrix
            question: How is a location write checked per responder?
          - value: tests.location_write_harness
            question: How are write approaches compared outside pytest?
          - value: location_write_scenario_yaml
            question: What world do location-write checks use?

parking_scenario:
    - description: Three cars, two parking spots, first come first served.
    - how:
          - value: parking.__init__
            question: How is it packaged?
          - value: parking.test_scenario
            question: How is it run and checked?
          - value: parking_scenario_yaml
            question: What world does it start from?

race_scenario:
    - description: The parking timings as a three-car race; only finishing order matters.
    - how:
          - value: race.__init__
            question: How is it packaged?
          - value: race.test_scenario
            question: How is it run and checked?
          - value: race_scenario_yaml
            question: What world does it start from?

project_tooling_tests:
    - description: Tests of the project's own manifest and git hooks.
    - how:
          - value: tests.test_architecture_manifest
            question: How is the architecture manifest checked?
          - value: tests.test_check_docstrings_hook
            question: How is the docstring hook checked?
          - value: tests.test_check_pr_size_hook
            question: How is the PR-size hook checked?

# ---------------------------------------------------------------------------
# Stand-ins for non-Python files (leaves)
# ---------------------------------------------------------------------------

schema_character:
    - description: Marks an entity as a character.
    - source_file: manifest/builtins.yaml::character
schema_object:
    - description: Marks an entity as an object.
    - source_file: manifest/builtins.yaml::object
schema_appearance:
    - description: How an entity currently looks.
    - source_file: manifest/builtins.yaml::appearance
schema_state:
    - description: A short current-status phrase, e.g. "open".
    - source_file: manifest/builtins.yaml::state
schema_location:
    - description: Where an entity is.
    - source_file: manifest/builtins.yaml::location
schema_physics_components:
    - description: Physical properties (largely for the shelved physics tools).
    - source_file: manifest/builtins.yaml::physics_components
schema_character_components:
    - description: Character-specific components (largely for shelved character tools).
    - source_file: manifest/builtins.yaml::character_components
schema_turn_components:
    - description: Turn bookkeeping components.
    - source_file: manifest/builtins.yaml::turn_components
schema_event_components:
    - description: Event timing, state, involvement and outcome -- the whole schedule.
    - source_file: manifest/builtins.yaml::event_components
schema_agent_components:
    - description: Components describing agents/responders.
    - source_file: manifest/builtins.yaml::agent_components
default_scenario:
    - description: A plain starting world (a player, a door, an empty expanse).
    - source_file: data/default/scenario.yaml
living_world_scenario:
    - description: The living world's original turn-zero seed.
    - source_file: data/living_world/scenario.yaml
living_world_current:
    - description: Current state, collapsed to the current row per entity.
    - source_file: data/living_world/world/world.yaml
living_world_history:
    - description: Every row ever recorded, uncollapsed.
    - source_file: data/living_world/world_history/world.yaml
parking_scenario_yaml:
    - description: The parking scenario's starting world.
    - source_file: tests/test_human_validated/test_scenarios/parking/scenario.yaml
race_scenario_yaml:
    - description: The race scenario's starting world.
    - source_file: tests/test_human_validated/test_scenarios/race/scenario.yaml
location_write_scenario_yaml:
    - description: One car, one spot -- the location-write fixture.
    - source_file: tests/data/scenarios/location_write_isolated/scenario.yaml
check_docstrings_hook:
    - description: Pre-commit hook flagging docstring edits in staged Python files.
    - source_file: scripts/check-docstrings.sh
check_pr_size_hook:
    - description: Pre-commit hook warning when a branch's diff gets large.
    - source_file: scripts/check-pr-size.sh
root_main_py:
    - description: Placeholder; the real entry point is story-simulator-mcp.
    - source_file: main.py
