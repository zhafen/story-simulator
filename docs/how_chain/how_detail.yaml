file_info:
- description: 'Generated by scripts/generate_how_detail.py -- edit question wording here freely (it''s
    kept on regeneration), but regenerate rather than hand-adding edges. Every how-chain edge below the
    file level: each file, class, or function to the classes/functions defined directly in it, and each
    file or class to its variables. Both ends live in source, so these are how_link rows with an explicit
    source, all held by how_chain_detail. Variables can''t carry docstrings, so each gets a stand-in entity
    below (named with __ for dots), described by the comment directly above it in source, or by its assignment
    if none.'
- file_info
how_link:
- description: A how-chain edge naming both ends explicitly (`source` and `value`), for links between
    two Python-sourced entities, neither of which can own a new component from YAML.
- parent: directed_relation
- field:
    source:
      description: The entity that asks how it is achieved.
      type: entity_ref
    value:
      description: The entity that is how the source gets achieved.
      type: entity_ref
    question:
      description: The "how" question this link answers.
      type: str
    note:
      description: Optional side note about this link.
      type: str
      nullable: true
