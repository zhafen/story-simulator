file_info:
- description: 'Generated by scripts/generate_how_detail.py -- edit question wording here freely (it''s
    kept on regeneration), but regenerate rather than hand-adding edges. The how-chain edges below the
    file level: each file to its own top-level classes/functions, and each class to its own methods. Both
    ends are real Python entities, so these are how_link rows with an explicit source, all held by how_chain_detail.'
- file_info
how_link:
- description: A how-chain edge naming both ends explicitly (`source` and `value`), for links between
    two Python-sourced entities, neither of which can own a new component from YAML.
- parent: directed_relation
- field:
    source:
      description: The entity that asks how it is achieved.
      type: entity_ref
    value:
      description: The entity that is how the source gets achieved.
      type: entity_ref
    question:
      description: The "how" question this link answers.
      type: str
    note:
      description: Optional side note about this link.
      type: str
      nullable: true
