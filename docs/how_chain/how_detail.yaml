JudgmentRequest__origin:
- description: Which function constructed this request (e.g. "resolve_event" vs. "plan_events") -- never
    folded into `prompt`/`render()`'s own text (a responder has no need to know this to answer), but carried
    through to whichever responder answers it so it lands in that call's own trace instead of being unrecoverable
    after the fact. "" (the default) matches call sites/tests that don't care to set it.
