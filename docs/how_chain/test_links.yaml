file_info:
- description: Generated by scripts/generate_how_detail.py -- regenerate rather than hand-edit. Links
    every test to the how-chain node(s) it tests, so the viewer can list a node's tests. A test's targets
    are the story-simulator objects it calls directly (resolved through its module's imports), else those
    its local helpers call, else a per-file override (TEST_OVERRIDES) for tests that run a hook or a whole
    scenario.
- file_info
test:
- description: 'A validation link: `source` is a test, `value` is the node it tests. Held by an index
    entity, like how_link, because a test function can''t own a component from YAML.'
- parent: directed_relation
- field:
    source:
      description: The test.
      type: entity_ref
    value:
      description: The node it tests.
      type: entity_ref
test_index:
- description: Every test link (see test).
