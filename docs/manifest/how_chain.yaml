file_info:
    - description: >
          story-simulator's "how chain": starting from the mission and
          repeatedly asking how it gets done, one entity per answer, until
          the answers are individual files and then individual functions
          (or, for YAML files, individual top-level definitions). Mirrors
          the how_chain experiment run on emc2p (iacs's poc/how_chain), but
          kept pure YAML: the tree is the nesting itself (each child is how
          its parent gets done), each node's ((how)) component holds the
          question it answers, and file/function nodes name their real
          location rather than loading the Python objects, so no source
          docstrings needed editing. Node keys drop leading underscores
          (``_seed_save_dir`` becomes ``seed_save_dir``); ``location`` has
          the exact name.

          Coverage: every file in story_simulator/, the world schema and
          seed data, and the dev scripts. tests/ and shelved/ are left out.
          This is a snapshot -- update it alongside the code it describes.
    - file_info

how:
    - description: >
          Marks an entity as one way its parent (in the YAML nesting) gets
          achieved. ``value`` is the "how" question this entity answers,
          from the parent's point of view; ``location`` is the file or
          ``file::name`` this entity corresponds to, once the chain is
          concrete enough to have one.
    - component_type
    - field:
          value:
              description: The "how" question this entity answers.
              type: str
          location:
              description: >
                  Repo-relative file path, or ``path::qualified_name`` for a
                  function/class/top-level YAML definition. Null for
                  conceptual nodes above the file level.
              type: str
              nullable: true

story_simulator_how_chain:
    data:
        - description: >
              The mission: enable players to create and experience
              self-consistent stories with simulation mechanics handled by
              AI (see story_simulator_mission in story-simulator.yaml).
              Every node below is one step of "how".

    # ------------------------------------------------------------------
    # 1. The player's interface: an AI game master driving MCP tools.
    # ------------------------------------------------------------------
    ai_game_master_interface:
        data:
            - description: >
                  Players talk to an MCP-aware chat agent acting as game
                  master. story-simulator exposes the tools that agent uses
                  to open a world, look things up, record changes, and run
                  the simulation. It never narrates itself.
            - how:
                  value: How do players experience and act in the story?
        mcp_server_py:
            data:
                - description: >
                      The thin MCP layer: each tool unpacks the session id
                      and calls straight into core.py. Its docstrings and
                      server instructions are the contract the host reads.
                - how:
                      value: How does a connected AI host actually call into story-simulator?
                      location: story_simulator/mcp_server.py
            server_instructions:
                - description: >
                      The FastMCP server and its game-master instructions:
                      the resolve/plan loop, how to record outcomes with
                      update_registry, and the list-form YAML gotcha.
                - how:
                      value: How does the host learn its role and the rules for recording changes?
                      location: story_simulator/mcp_server.py::server
            start_world:
                - description: Tool that opens (or seeds) a world save for this session.
                - how:
                      value: How does a player open or resume a world?
                      location: story_simulator/mcp_server.py::start_world
            advance_simulation:
                - description: >
                      Tool that runs the event loop until it needs host
                      input or the schedule empties; resumed with
                      resume_token + answer (MRTR, no second tool).
                - how:
                      value: How does the host move the story forward in time?
                      location: story_simulator/mcp_server.py::advance_simulation
            registry_tools_mount:
                - description: >
                      Mounts emc2p's view_registry, view_entity,
                      update_registry and consolidate_review onto this
                      server, excluding open_registry so a client can't swap
                      the world's registrar mid-session.
                - how:
                      value: How does the host look things up and record what happened?
                      location: story_simulator/mcp_server.py::core.registrar_sessions.mount
            main:
                - description: Runs the server over stdio (the story-simulator-mcp entry point).
                - how:
                      value: How does the server get started?
                      location: story_simulator/mcp_server.py::main

    # ------------------------------------------------------------------
    # 2. Self-consistency: the world lives in a registry, not the context.
    # ------------------------------------------------------------------
    self_consistent_world_state:
        data:
            - description: >
                  World state lives in a Postgres-backed emc2p registry with
                  a typed schema and full history, not in the model's
                  context, so facts stay consistent across turns and
                  sessions.
            - how:
                  value: How do stories stay self-consistent over time?
        world_schema:
            data:
                - description: The component types a world is allowed to use.
                - how:
                      value: How is it decided what kinds of facts a world can hold?
            builtins_yaml:
                data:
                    - description: >
                          story-simulator's world schema, merged into every
                          world registry (config.MANIFEST_DIR).
                    - how:
                          value: Where is the world schema defined?
                          location: manifest/builtins.yaml
                character:
                    - description: Marks an entity as a character.
                    - how:
                          value: How is a character represented?
                          location: manifest/builtins.yaml::character
                object:
                    - description: Marks an entity as an object.
                    - how:
                          value: How is an object represented?
                          location: manifest/builtins.yaml::object
                appearance:
                    - description: How an entity currently looks.
                    - how:
                          value: How is an entity's look recorded?
                          location: manifest/builtins.yaml::appearance
                state:
                    - description: >
                          A short current-status phrase (e.g. "open"), with
                          a time_dimension so the latest row is current.
                    - how:
                          value: How is an entity's current status recorded?
                          location: manifest/builtins.yaml::state
                location:
                    - description: Where an entity is.
                    - how:
                          value: How is an entity's whereabouts recorded?
                          location: manifest/builtins.yaml::location
                physics_components:
                    - description: Physical properties (largely for the shelved physics tools).
                    - how:
                          value: How are physical properties recorded?
                          location: manifest/builtins.yaml::physics_components
                character_components:
                    - description: Character-specific components (largely for shelved character tools).
                    - how:
                          value: How are character-specific facts recorded?
                          location: manifest/builtins.yaml::character_components
                turn_components:
                    - description: Turn bookkeeping components.
                    - how:
                          value: How are turns recorded?
                          location: manifest/builtins.yaml::turn_components
                event_components:
                    - description: >
                          The event schema: start_time, duration,
                          event_state, involved_entity, outcome. Events are
                          the simulation's whole schedule.
                    - how:
                          value: How are scheduled happenings represented?
                          location: manifest/builtins.yaml::event_components
                agent_components:
                    - description: Components describing agents/responders.
                    - how:
                          value: How are agents recorded in the world?
                          location: manifest/builtins.yaml::agent_components
        registry_storage:
            data:
                - description: >
                      One Postgres schema per save_dir, opened once per MCP
                      session and shared with emc2p's RegistrarSessions.
                - how:
                      value: How is world state stored durably and shared across processes?
            database_location:
                data:
                    - description: Which database and schema a save uses.
                    - how:
                          value: How does a save find its database?
                resolve_database_dsn:
                    - description: Reads STORY_SIM_DATABASE_DSN, defaulting to local Postgres.
                    - how:
                          value: How is the database connection string chosen?
                          location: story_simulator/config.py::resolve_database_dsn
                registry_schema_name:
                    - description: Hashes the resolved save_dir path into a stable schema name.
                    - how:
                          value: How do saves avoid colliding in one database?
                          location: story_simulator/config.py::registry_schema_name
                registry_url:
                    - description: Combines DSN and schema into an ibis.connect URL.
                    - how:
                          value: How does the registrar connect to a save's schema?
                          location: story_simulator/config.py::registry_url
            postgres_bootstrap:
                data:
                    - description: Makes sure a reachable database and schema exist before opening.
                    - how:
                          value: How does opening a world work on a fresh machine?
                is_local_dsn:
                    - description: True if the DSN points at this machine.
                    - how:
                          value: How is it decided whether auto-starting Postgres is safe?
                          location: story_simulator/core.py::_is_local_dsn
                can_connect:
                    - description: Tries a connection, returning the error text on failure.
                    - how:
                          value: How is reachability checked?
                          location: story_simulator/core.py::_can_connect
                start_local_postgres:
                    - description: Best-effort start of a local postgresql service.
                    - how:
                          value: How is a stopped local database brought up?
                          location: story_simulator/core.py::_start_local_postgres
                ensure_default_dev_password:
                    - description: Sets the local postgres role's password to the documented default.
                    - how:
                          value: How does a fresh local install accept the default DSN?
                          location: story_simulator/core.py::_ensure_default_dev_password
                ensure_postgres_running:
                    - description: Orchestrates the checks above, raising a clear error if still unreachable.
                    - how:
                          value: How are these steps combined?
                          location: story_simulator/core.py::_ensure_postgres_running
                ensure_postgres_schema:
                    - description: Creates the save's schema if missing.
                    - how:
                          value: How does a brand-new save get its namespace?
                          location: story_simulator/core.py::_ensure_postgres_schema
            registrar_sessions:
                - description: >
                      emc2p RegistrarSessions instance keyed by MCP session,
                      with world-time stamping and world/ + world_history/
                      export wired in.
                - how:
                      value: How does each session keep one open registrar and re-export the save after every write?
                      location: story_simulator/core.py::registrar_sessions
        world_saves:
            data:
                - description: >
                      Saves are directories: a seed scenario plus world/
                      (current state) and world_history/ (every row),
                      re-exported after each update_registry call.
                - how:
                      value: How does a world persist outside the database and get started from a scenario?
            start_world:
                - description: >
                      Ensures Postgres, opens the save's registrar, and
                      merges the seed YAML only on first open.
                - how:
                      value: How is a save opened or created?
                      location: story_simulator/core.py::start_world
            seed_save_dir:
                - description: Copies a starting scenario into a brand-new, empty save_dir.
                - how:
                      value: How does a new save get its starting data?
                      location: story_simulator/core.py::_seed_save_dir
            yaml_files:
                - description: Recursive, sorted list of YAML files under a directory.
                - how:
                      value: How are a save's YAML sources found?
                      location: story_simulator/core.py::_yaml_files
            default_scenario:
                - description: A plain starting world (a player, a door, an empty expanse).
                - how:
                      value: What does a world start from by default?
                      location: data/default/scenario.yaml
            living_world:
                data:
                    - description: >
                          A real playthrough's save, committed so its
                          progress survives. Continue it as save_dir; it is
                          not a pristine template.
                    - how:
                          value: How is the long-running shared playthrough kept?
                          location: data/living_world
                scenario_yaml:
                    - description: The playthrough's original turn-zero seed.
                    - how:
                          value: What did the living world start from?
                          location: data/living_world/scenario.yaml
                world_yaml:
                    - description: Current state, collapsed to the current row per entity.
                    - how:
                          value: What is the living world's current state?
                          location: data/living_world/world/world.yaml
                world_history_yaml:
                    - description: Every row ever recorded, uncollapsed.
                    - how:
                          value: What is the living world's full change history?
                          location: data/living_world/world_history/world.yaml

    # ------------------------------------------------------------------
    # 3. Simulation mechanics: the event-driven loop.
    # ------------------------------------------------------------------
    event_driven_simulation:
        data:
            - description: >
                  World state is a schedule of event entities. The loop pops
                  the soonest-ending event, advances the clock, and asks for
                  a resolution and a plan, pausing whenever only the host can
                  answer.
            - how:
                  value: How are simulation mechanics carried out over time?
        core_py:
            data:
                - description: >
                      The simulation kernel: event loop, pause/resume, and
                      (see self_consistent_world_state) world opening.
                - how:
                      value: Where does the event loop live?
                      location: story_simulator/core.py
            event_loop:
                data:
                    - description: One function per box of the event-loop flowchart.
                    - how:
                          value: How does one pass of the loop work?
                run_event_loop:
                    - description: Pop event, check validity, process; repeat until paused or empty.
                    - how:
                          value: How does the loop keep going?
                          location: story_simulator/core.py::_run_event_loop
                pop_event:
                    - description: Returns the event whose end_time comes soonest, or None.
                    - how:
                          value: How is the next thing to happen chosen?
                          location: story_simulator/core.py::pop_event
                is_event_valid:
                    - description: Checks the alias is still a real, eligible entity.
                    - how:
                          value: How are stale events skipped?
                          location: story_simulator/core.py::is_event_valid
                process_event:
                    - description: Advance clock, then resolve, then plan.
                    - how:
                          value: How is one event handled end to end?
                          location: story_simulator/core.py::process_event
                advance_clock:
                    - description: The event's start_time + duration becomes "now".
                    - how:
                          value: How does world time move?
                          location: story_simulator/core.py::advance_clock
                next_time_stamp:
                    - description: The current in-fiction time, used to stamp new rows.
                    - how:
                          value: How do writes get the right world time?
                          location: story_simulator/core.py::_next_time_stamp
                resolve_event:
                    - description: Asks a responder what happened now that the event's end_time is reached.
                    - how:
                          value: How is an event's outcome decided?
                          location: story_simulator/core.py::resolve_event
                plan_events:
                    - description: Asks a responder whether anything new should be scheduled as a result.
                    - how:
                          value: How do consequences get scheduled?
                          location: story_simulator/core.py::plan_events
            pause_and_resume:
                data:
                    - description: >
                          Pauses survive disconnects and restarts: the
                          resume_token is the paused event's alias and its
                          answers live in the registry.
                    - how:
                          value: How does the loop pause for the host and pick up where it left off?
                advance_simulation:
                    - description: Entry point -- decodes resume args, run the loop, shape the result.
                    - how:
                          value: How is a pause/resume round trip driven?
                          location: story_simulator/core.py::advance_simulation
                save_pending:
                    - description: Persists a paused turn's answers into the registry, keyed to the event.
                    - how:
                          value: How is pause state stored without process memory?
                          location: story_simulator/core.py::_save_pending
                load_pending:
                    - description: Looks a resume_token back up in the registry.
                    - how:
                          value: How is pause state recovered?
                          location: story_simulator/core.py::_load_pending
                resolve_args:
                    - description: Validates and decodes resume_token/answer.
                    - how:
                          value: How are bad resume calls rejected?
                          location: story_simulator/core.py::_resolve_args
                wrap_loop_result:
                    - description: Shapes done / input_required results.
                    - how:
                          value: How does the host get a consistent result shape?
                          location: story_simulator/core.py::_wrap_loop_result

    # ------------------------------------------------------------------
    # 4. "Handled by AI": who makes each judgment call.
    # ------------------------------------------------------------------
    ai_judgment:
        data:
            - description: >
                  Each resolve/plan step is a judgment call answered by an
                  AI: the host inline, the host's own subagent, or an
                  in-process keyed subagent on story-simulator's own key.
            - how:
                  value: How does AI handle the simulation's judgment calls?
        resolve_py:
            data:
                - description: >
                      The judgment resolver: one request shape for every
                      responder; pauses by raising and resumes by replaying
                      the turn with the answers so far.
                - how:
                      value: How does a judgment call reach a responder from any nesting depth?
                      location: story_simulator/resolve.py
            JudgmentRequest:
                data:
                    - description: One judgment ask, the same shape whoever answers it.
                    - how:
                          value: How is a question to a responder represented?
                          location: story_simulator/resolve.py::JudgmentRequest
                render:
                    - description: Flattens the request to plain text.
                    - how:
                          value: How is a request turned into a prompt?
                          location: story_simulator/resolve.py::JudgmentRequest.render
            NeedsExternalInput:
                - description: Raised to unwind to the tool boundary when only the host can answer.
                - how:
                      value: How does a deep call pause the turn?
                      location: story_simulator/resolve.py::NeedsExternalInput
            frame_for_responder:
                - description: Wraps the request with instructions for host, subagent, or human.
                - how:
                      value: How is the host told whether to answer inline or delegate?
                      location: story_simulator/resolve.py::_frame_for_responder
            TurnReplay:
                data:
                    - description: A call-index counter plus the answers so far for one turn.
                    - how:
                          value: How are already-answered calls replayed instead of re-asked?
                          location: story_simulator/resolve.py::TurnReplay
                resolve:
                    - description: >
                          Returns a banked answer, answers inline via the
                          keyed subagent (within its time budget), or raises
                          NeedsExternalInput.
                    - how:
                          value: How is each judgment call answered or deferred?
                          location: story_simulator/resolve.py::TurnReplay.resolve
        keyed_subagent_py:
            data:
                - description: >
                      The in-process "keyed_subagent" responder: emc2p's
                      tool-calling loop with registry tools dispatched
                      straight to this world's registrar.
                - how:
                      value: How can judgment calls be answered without a round trip to the host?
                      location: story_simulator/keyed_subagent.py
            call_keyed_subagent:
                - description: Answers one framed prompt with real registry access, tracing each write.
                - how:
                      value: How does the keyed subagent answer and persist a decision?
                      location: story_simulator/keyed_subagent.py::call_keyed_subagent
            log_write_call:
                - description: Temporary diagnostic log of update_registry calls (#70).
                - how:
                      value: How are misfired writes debugged?
                      location: story_simulator/keyed_subagent.py::_log_write_call
        responder_configuration:
            data:
                - description: Environment-driven choice of responder, model, budget and key.
                - how:
                      value: How is it chosen which AI answers, and with what limits?
            event_responder:
                - description: Reads STORY_SIM_RESPONDER (host, subagent, keyed_subagent).
                - how:
                      value: How is the responder chosen?
                      location: story_simulator/config.py::event_responder
            keyed_subagent_model:
                - description: Reads STORY_SIM_SUBAGENT_MODEL (LiteLLM model string).
                - how:
                      value: How is the keyed subagent's model chosen?
                      location: story_simulator/config.py::keyed_subagent_model
            keyed_subagent_time_budget_seconds:
                - description: Seconds the keyed subagent may run before checking in with the host.
                - how:
                      value: How is unattended running bounded?
                      location: story_simulator/config.py::keyed_subagent_time_budget_seconds
            resolve_anthropic_api_key:
                - description: Reads STORY_SIM_ANTHROPIC_API_KEY.
                - how:
                      value: How is story-simulator's own Anthropic key found?
                      location: story_simulator/config.py::resolve_anthropic_api_key

    # ------------------------------------------------------------------
    # 5. Supporting pieces.
    # ------------------------------------------------------------------
    supporting_pieces:
        data:
            - description: Shared configuration and development tooling.
            - how:
                  value: How do the parts above share settings, and how is the project kept healthy?
        config_py:
            - description: >
                  Shared paths, database settings and responder settings;
                  its functions are listed under registry_storage and
                  responder_configuration.
            - how:
                  value: How do modules avoid hardcoding paths and settings?
                  location: story_simulator/config.py
        development_tooling:
            data:
                - description: Scripts and hooks used while developing, not at runtime.
                - how:
                      value: How is development kept on track?
            check_docstrings_sh:
                - description: Pre-commit hook flagging docstring edits in staged Python files.
                - how:
                      value: How are docstring changes surfaced for review?
                      location: scripts/check-docstrings.sh
            check_pr_size_sh:
                - description: Pre-commit hook warning when a branch's diff gets large.
                - how:
                      value: How are PRs kept to a reviewable size?
                      location: scripts/check-pr-size.sh
            get_usage_py:
                - description: Reads Claude Code usage % by driving an interactive session.
                - how:
                      value: How is usage cost measured before/after a test batch?
                      location: scripts/get_usage.py
            main_py:
                - description: Placeholder entry point (prints a greeting); the real one is story-simulator-mcp.
                - how:
                      value: What is the root main.py?
                      location: main.py
