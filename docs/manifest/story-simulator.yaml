# Project-level iacs manifest for story-simulator itself (not world-state data —
# see manifest/builtins.yaml for that). Models what the project must guarantee as
# `requirement` entities, what code satisfies each as `solution of` entities, and
# candidate next work as impact/cost-scored entities, so run_dataflow("audit.*")
# and the derived resolved_impact_cost table can be used to decide what to work
# on next instead of re-deriving that from memory each time.
#
# Deliberately kept under docs/, not manifest/ (= story_simulator.config.MANIFEST_DIR):
# that directory is passed as input_dirs to every registrar.update() call, so
# anything under it is merged as data into every live game world's registry, not
# just used for schema. Load this file explicitly with the iacs MCP server's
# own load_manifest(["docs/manifest"]) (or set IACS_MANIFEST) when you want to
# query or audit it — it's independent of any save's registry.

# ---------------------------------------------------------------------------
# Impact/cost vocabulary for scoring candidate work (see "next_work" below).
# Conversion rates are relative weights, not a claim of precise measurement —
# they only need to rank candidates sensibly against each other.
# ---------------------------------------------------------------------------

impact_budgets:
    - description: >
          Impact types used to score candidate next-work items for this project.
    - impact_budget:
          reliability:
              description: >
                  Closes a correctness/consistency gap in a tool that's already
                  relied on (wrong state, silent duplication, unverified LLM
                  behavior, an agent acting on stale data).
              normalized_value_per_unit: 2
          gameplay_richness:
              description: >
                  Expands what a connected agent or player can actually do or
                  see in a played session.
              normalized_value_per_unit: 1
          architecture_clarity:
              description: >
                  Reduces ambiguity, dead code, or unresolved design tension for
                  future contributors (including a future session of this same
                  assistant).
              normalized_value_per_unit: 1

cost_budgets:
    - description: >
          Cost types used to score candidate next-work items for this project.
    - cost_budget:
          engineering_hours:
              description: Estimated implementation/design time, in hours.
              normalized_value_per_unit: 1
          regression_risk:
              description: >
                  Chance of destabilizing an already-working tool if this goes
                  wrong (weighted heavier than plain time cost).
              normalized_value_per_unit: 2

# ---------------------------------------------------------------------------
# What the project must guarantee, and what satisfies it.
# ---------------------------------------------------------------------------

story_simulator_requirements:
    data:
        - description: >
              story-simulator is just an MCP server: no in-process agent loop.
              Whatever MCP-aware client connects (human chat agent, automated
              harness) is the narrator; world state lives in a structured
              iacs entity/component registry, not in that client's own context.
        - requirement: 1
    stateless_client:
        - description: >
              Any MCP-aware client can open the same save_dir and see identical
              world state — nothing narratively load-bearing lives only in one
              client's conversation context.
        - requirement: 1
    single_shared_source_key:
        - description: >
              Every direct registrar.update() call (mcp_server.py, spatial.py)
              must merge under the same source key (config.WORLD_FILE_ID), or
              the same alias written from two call sites would hash to two
              different entity_ids and silently fork a duplicate entity instead
              of updating the original.
        - requirement: 0.9
    concurrent_readable_registry:
        - description: >
              The registry backend must let a live session's connection stay
              open for the session's whole lifetime while other processes still
              read or write concurrently — rules out a single-file embedded
              database (e.g. DuckDB), which locks out every other connection
              while one process holds it open.
        - requirement: 0.8
    dev_db_bootstrap:
        - description: >
              In a dev/sandbox environment, start_world should self-heal a
              localhost-only Postgres that isn't running yet rather than
              failing outright — a deliberately remote or already-configured
              server must never be touched.
        - requirement: 0.4
    tool_catalog:
        data:
            - description: The MCP tools story-simulator exposes, and what each must guarantee.
        start_world:
            - description: >
                  Opens or seeds a save_dir'd world, remembered for the session.
                  Must seed only an empty save from settings_dir/DEFAULT_WORLD_DIR
                  once — a resumed save's accumulated registry state must never
                  be re-merged with the starting scenario on reconnect.
            - requirement: 0.9
        view_registry:
            - description: CSV dump of every recorded instance of one component type.
            - requirement: 0.6
        view_entity:
            - description: >
                  Every recorded component instance for one entity, resolved by
                  exact hash, exact alias, or unambiguous path fragment.
            - requirement: 0.6
        update_registry:
            - description: Merges entity-first YAML into the registry through the same ETL as save files.
            - requirement: 0.9
        perceive:
            - description: >
                  Computes nearby entities for a reference alias, tags them
                  active (replacing whatever was previously tagged active), and
                  permanently merges them into that alias's memory (memory only
                  grows; active is a live snapshot).
            - requirement: 0.8
        generate_terrain:
            - description: One LiteLLM call inventing terrain for a location with none established, consistent with what's already known.
            - requirement: 0.6
        resolve_physics:
            - description: One LiteLLM call judging the plausible physical outcome of an action not obviously safe to decide directly.
            - requirement: 0.6
        advance_npc_turn:
            - description: >
                  Decides, narrates, and records one NPC's whole turn — the one
                  case with nobody chatting to drive it — via a nested
                  decide-then-(generate_terrain/resolve_physics/update_registry)*
                  loop.
            - requirement: 0.7
    npc_authority_separation:
        - description: >
              An NPC's decide step must stay restricted (perceive-scoped view,
              no tools) while its resolve+record step, which needs broader
              authority to call update_registry, should not implicitly carry the
              same unrestricted write authority a human-narrating client has.
              Currently unmet — see next_work.restrict_npc_write_access.
        - requirement: 0.5
    seed_yaml_reflects_live_state:
        - description: >
              An agent that reads a save's seed *.yaml directly (data/*/setting.yaml
              or its copy in save_dir) should see current registry state, or at
              least be clearly warned it can't — update_registry writes only to
              the registry database, never back to any file, so the seed YAML
              stays frozen at turn-zero while Postgres holds the real current
              state. Confirmed happening in practice: a coding agent defaults to
              grepping/reading the YAML instead of calling view_registry/
              view_entity. Currently unmet.
        - requirement: 0.5
    ec_defined_agents:
        - description: >
              An entity with an `agent` component (role/model/system_prompt)
              should be usable the same way story_simulator.agents.AgentSpec is
              today from a *.yaml file, letting a world-author define an agent
              (Terrain, Physics, an NPC decision-maker, or their own) inside the
              registry instead of only in a checked-in config file. Reserved in
              manifest/builtins.yaml; not read by any code yet.
        - requirement: 0.3
    world_time_concept:
        - description: >
              The simulation has no representation of in-fiction elapsed time
              (day/night, how long a character has walked, the living world's
              "a year forward" door mechanic) independent of the wall-clock
              ordering value (_next_turn_stamp) that only exists to resolve
              which of an entity's position rows is current.
        - requirement: 0.3
    live_model_test_coverage:
        - description: >
              generate_terrain/resolve_physics/advance_npc_turn's actual LLM
              behavior, and a realistic multi-tool-call play session, should
              have real-model (@pytest.mark.live) coverage, not just
              tool-level tests against a mocked LLM.
        - requirement: 0.5
    per_provider_credentials:
        - description: >
              Only Anthropic-flavored model: strings get app-specific credential
              handling (resolve_anthropic_api_key). Every other LiteLLM-supported
              provider relies on that provider's own standard env-var discovery;
              there's no general per-user, per-provider credential story yet.
        - requirement: 0.2
    position_render_tool:
        - description: >
              The pre-rebuild VisualizerSystem's SVG position plot has no
              equivalent MCP tool today — a connected agent can't currently get
              a rendered top-down view of the world, only text.
        - requirement: 0.3

mcp_server_solutions:
    data:
        - description: story_simulator/mcp_server.py — the FastMCP server exposing every tool above.
        - solution of: story_simulator_requirements.stateless_client
    start_world_impl:
        - description: >
              Seeds save_dir from settings_dir/DEFAULT_WORLD_DIR only when the
              schema's registry has no component types yet; merges seed YAML
              under WORLD_FILE_ID (not per-file paths) so seeded and later-written
              aliases share one entity_id space.
        - solution of: story_simulator_requirements.tool_catalog.start_world
        - work_state: done
    view_registry_impl:
        - solution of: story_simulator_requirements.tool_catalog.view_registry
        - work_state: done
    view_entity_impl:
        - solution of: story_simulator_requirements.tool_catalog.view_entity
        - work_state: done
    update_registry_impl:
        - solution of: story_simulator_requirements.tool_catalog.update_registry
        - work_state: done
    perceive_impl:
        - solution of: story_simulator_requirements.tool_catalog.perceive
        - work_state: done
    generate_terrain_impl:
        - solution of: story_simulator_requirements.tool_catalog.generate_terrain
        - work_state: done
    resolve_physics_impl:
        - solution of: story_simulator_requirements.tool_catalog.resolve_physics
        - work_state: done
    advance_npc_turn_impl:
        - description: >
              Nests its own generate_terrain/resolve_physics/update_registry
              calls via agents.run_tool_loop; decide step (npc.yaml) is
              tool-free and perceive-scoped, but the resolve+record step
              (npc_resolver.yaml) is handed update_registry directly, so it
              currently carries the same unrestricted write authority as a full
              narrator — the gap npc_authority_separation names.
        - solution of: story_simulator_requirements.tool_catalog.advance_npc_turn
        - work_state: done
    shared_world_file_id:
        - description: config.WORLD_FILE_ID is the one literal source key every registrar.update() call across the project agrees to merge under.
        - solution of: story_simulator_requirements.single_shared_source_key
        - work_state: done
    postgres_auto_start_impl:
        - description: >
              _ensure_postgres_running tries a local service start only when
              resolve_database_dsn() points at localhost and the connection was
              refused outright; on a brand-new cluster with no password set yet,
              falls back to setting the documented dev password via a
              peer-authenticated psql call. Any other failure (including a
              reachable server just rejecting these credentials) surfaces
              through _ensure_postgres_schema's own connect instead of being
              papered over here.
        - solution of: story_simulator_requirements.dev_db_bootstrap
        - work_state: done

spatial_solutions:
    - description: >
          story_simulator/spatial.py — position/distance/perception helpers,
          ported from the old per-turn MapSystem into on-demand functions any
          tool can call, since there's no more automatic per-turn pass.
    - solution of: story_simulator_requirements.tool_catalog.perceive
    - work_state: done

registry_backend_solution:
    - description: >
          Registry lives in Postgres by default (any ibis-connectable
          client/server backend works), one schema per save_dir
          (config.registry_schema_name hashes the resolved save_dir path),
          replacing an earlier DuckDB-backed design that locked out concurrent
          connections.
    - solution of: story_simulator_requirements.concurrent_readable_registry
    - work_state: done

npc_authority_solution:
    - description: >
          Partial: the decide step (npc.yaml) is already correctly scoped
          (no tools, perceive-limited view). The resolve+record step
          (npc_resolver.yaml via run_tool_loop) is not — still needs a
          redesign that keeps those two steps' authority separate, and a
          decision on whether resolve+record belongs in advance_npc_turn at
          all versus being handed to whichever narrator already holds that
          authority.
    - solution of: story_simulator_requirements.npc_authority_separation
    - work_state: in progress

# ---------------------------------------------------------------------------
# Historical context pulled out of code comments and docs, kept here instead
# of scattered across the codebase. Not actionable — reference only.
# ---------------------------------------------------------------------------

project_history:
    data:
        - description: >
              Non-actionable historical record of how the project reached its
              current shape. See RESET_LOG.md for the pre-history repo reset
              itself (commit 69a94c3, 2024-04-28).
    turn_pipeline_removed:
        - description: >
              Commit acb2956 ("Remove the turn-pipeline/REPL apparatus") deleted
              EnsembleWorld, Interpreter, System.step(), and the Archivist/
              IacsArchivist transcription agent (previously documented in the
              since-removed docs/startup-loop-save-plan.md), in favor of the
              current MCP-only architecture (commit 28ba40c, "Rebuild
              story-simulator as just an MCP server"). story_simulator/mcp_client.py
              (the stdio MCP client wrapper written for IacsArchivist to talk
              to iacs-mcp) survived that removal but is no longer imported by
              anything — see next_work.remove_orphaned_mcp_client.
    database_migrated_to_postgres:
        - description: >
              The registry moved from an embedded DuckDB file to Postgres
              specifically because DuckDB's file-based storage locks out every
              other connection for as long as one process holds it open, which
              is incompatible with a live MCP session that must stay open for
              its whole lifetime while other processes (e.g. a test) read it.
    appearance_retired_for_description:
        - description: >
              The `appearance` component type used by the pre-rebuild tests was
              retired in favor of iacs's own builtin `description` component,
              which every declared component/field already uses for its own
              schema docstring.
    seed_yaml_staleness_discovered:
        - description: >
              Confirmed directly: several update_registry calls that changed a
              door's recorded description left both the source seed YAML and
              the save's copied YAML byte-identical to the original, untouched
              mtimes and all. Surfaced the seed_yaml_reflects_live_state gap.
    claude_md_reload_trick_documented:
        - description: >
              CLAUDE.md documents that story-simulator-mcp is a long-lived
              stdio subprocess spawned once per session — editing
              mcp_server.py (or anything it imports) has no effect until it's
              killed (pkill -f story-simulator-mcp) so the harness respawns it
              fresh on the next tool call. Unrelated to seed_yaml_reflects_live_state.

# ---------------------------------------------------------------------------
# Candidate next work, scored for a cost-vs-impact read (see
# iacs's resolved_impact_cost, derived automatically from impact+cost below).
# ---------------------------------------------------------------------------

next_work:
    author_architecture_manifest:
        - description: >
              This manifest: model story-simulator's own architecture as
              requirement/solution entities so run_dataflow("audit.traceability")/
              ("audit.requirement_coverage") can check the project's own design,
              and score open follow-ups for a cost-vs-impact read instead of
              re-deriving priorities from scattered prose each time.
        - solution of: story_simulator_requirements
        - work_state: done
        - impact:
              - type: architecture_clarity
                value: 0.8
        - cost:
              - type: engineering_hours
                value: 3
    fix_seed_yaml_staleness:
        - description: >
              Two candidate approaches, not mutually exclusive: (1) warn —
              add a line to the MCP server's own `instructions` string (read by
              any connected client) and/or a header comment on each seed YAML,
              cheap but doesn't fix the root cause; (2) sync — have
              update_registry export the registry's current state back out to
              save_dir's YAML every turn (the direction iacs-mcp's refresh tool
              already writes in), so the save's YAML becomes a live, read-only
              mirror instead of frozen seed data. Sync needs its own design
              pass (full re-export per call vs. batched/on-demand) first.
        - solution of: story_simulator_requirements.seed_yaml_reflects_live_state
        - work_state: new
        - impact:
              - type: reliability
                value: 0.6
        - cost:
              - type: engineering_hours
                value: 5
              - type: regression_risk
                value: 0.3
    restrict_npc_write_access:
        - description: >
              Split advance_npc_turn's resolve+record step from unrestricted
              update_registry authority — either scope it down or hand that
              step to whichever narrator already holds full authority, reserving
              true autonomy for when genuinely nobody is watching.
        - solution of: story_simulator_requirements.npc_authority_separation
        - work_state: new
        - impact:
              - type: reliability
                value: 0.6
              - type: architecture_clarity
                value: 0.5
        - cost:
              - type: engineering_hours
                value: 6
              - type: regression_risk
                value: 0.5
    add_live_llm_test_coverage:
        - description: >
              Add @pytest.mark.live tests for generate_terrain/resolve_physics/
              advance_npc_turn's actual model behavior, plus a scripted
              multi-tool-call session — currently only tool-level tests against
              a mocked LLM plus test_human_validated.py's three scenarios exist.
        - solution of: story_simulator_requirements.live_model_test_coverage
        - work_state: new
        - impact:
              - type: reliability
                value: 0.6
        - cost:
              - type: engineering_hours
                value: 5
    remove_orphaned_mcp_client:
        - description: >
              story_simulator/mcp_client.py (open_iacs_mcp_session,
              McpToolSession) has had no importer since the turn-pipeline
              removal (acb2956) deleted the Archivist that used it. Either
              delete it or repurpose it for ec_defined_agents (an EC-defined
              agent could plausibly need to talk to iacs-mcp the same way).
        - solution of: story_simulator_requirements.ec_defined_agents
        - work_state: new
        - impact:
              - type: architecture_clarity
                value: 0.4
        - cost:
              - type: engineering_hours
                value: 1
              - type: regression_risk
                value: 0.1
    wire_ec_defined_agents:
        - description: >
              Add a loader that turns an `agent` entity (role/model/system_prompt)
              into an AgentSpec, and an MCP tool that dispatches to it, so a
              world-author can define Terrain/Physics/NPC-decision agents (or
              their own) inside the registry instead of only in checked-in
              *.yaml files next to the package.
        - solution of: story_simulator_requirements.ec_defined_agents
        - work_state: new
        - impact:
              - type: gameplay_richness
                value: 0.6
              - type: architecture_clarity
                value: 0.3
        - cost:
              - type: engineering_hours
                value: 10
              - type: regression_risk
                value: 0.3
    evaluate_world_time_concept:
        - description: >
              Evaluate an explicit world-time component (in-fiction elapsed
              time/calendar) independent of the wall-clock ordering value
              _next_turn_stamp already provides, so the simulation can reason
              about story-internal chronology instead of only narrating it.
        - solution of: story_simulator_requirements.world_time_concept
        - work_state: new
        - impact:
              - type: gameplay_richness
                value: 0.4
        - cost:
              - type: engineering_hours
                value: 8
              - type: regression_risk
                value: 0.2
    generalize_provider_credentials:
        - description: >
              Give every LiteLLM-supported provider (not just Anthropic-flavored
              model: strings) an app-specific, per-user credential path, instead
              of relying on each provider's own standard env-var discovery.
        - solution of: story_simulator_requirements.per_provider_credentials
        - work_state: new
        - impact:
              - type: gameplay_richness
                value: 0.2
        - cost:
              - type: engineering_hours
                value: 4
    port_position_render_tool:
        - description: >
              Port the pre-rebuild VisualizerSystem's SVG position plot to an
              MCP tool, so a connected agent can get a rendered top-down view of
              the world instead of only text.
        - solution of: story_simulator_requirements.position_render_tool
        - work_state: new
        - impact:
              - type: gameplay_richness
                value: 0.5
        - cost:
              - type: engineering_hours
                value: 5
              - type: regression_risk
                value: 0.1
