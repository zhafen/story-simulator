file_info:
    - description: >
          Project-level iacs manifest for story-simulator itself (not
          world-state data — see manifest/builtins.yaml for that). Models
          what the project must guarantee as a tree of `requirement` entities
          rooted at story_simulator_mission, what code satisfies each as
          `solution of` entities, and scores each not-yet-done requirement
          with `impact`/`cost` components so the derived resolved_impact_cost
          table can drive a cost-vs-impact read on what to work on next.

          Deliberately kept under docs/, not manifest/ (=
          story_simulator.config.MANIFEST_DIR): that directory is passed as
          input_dirs to every registrar.update() call, so anything under it
          is merged as data into every live game world's registry, not just
          used for schema. History that isn't itself a requirement lives in
          history.yaml, kept separate so it isn't scanned in as part of
          assessing requirements.

          Most solutions live as `__iacs__ = {"solution of": ...}` metadata in
          the docstring of the code that solves them, not as entities here —
          load_manifest(["docs/manifest", "story_simulator"]) picks up both
          this requirement tree and every Python-embedded solution. Loading
          this directory alone under-reports coverage.
    - file_info

# Impact/cost vocabulary for scoring candidate work (see requirement
# entities below). Conversion rates are relative weights, not precise measurement.

impact_budgets:
    - description: >
          Impact types used to score requirement entities in this project.
    - impact_budget:
          reliability:
              description: >
                  Closes a correctness/consistency gap in a tool that's already
                  relied on (wrong state, silent duplication, unverified LLM
                  behavior, an agent acting on stale data).
              normalized_value_per_unit: 2
          gameplay_richness:
              description: >
                  Expands what a connected agent or player can actually do or
                  see in a played session.
              normalized_value_per_unit: 1
          architecture_clarity:
              description: >
                  Reduces ambiguity, dead code, or unresolved design tension for
                  future contributors (including a future session of this same
                  assistant).
              normalized_value_per_unit: 1
          developer_experience:
              description: >
                  Reduces friction or setup cost for whoever is developing or
                  running the project locally, as opposed to a player.
              normalized_value_per_unit: 0.5

cost_budgets:
    - description: >
          Cost types used to score requirement entities in this project.
    - cost_budget:
          engineering_hours:
              description: Estimated implementation/design time, in hours.
              normalized_value_per_unit: 1
          regression_risk:
              description: >
                  Chance of destabilizing an already-working tool if this goes
                  wrong (weighted heavier than plain time cost).
              normalized_value_per_unit: 2

# story_simulator_mission is the tree root; every requirement in the
# project is a descendant of it. `requirement` is a bare tag.

story_simulator_mission:
    data:
        - description: To enable players to create and experience self-consistent stories with simulation mechanics handled by AI.
        - requirement_priority
    stateless_client:
        - description: >
              Any MCP-aware client can open the same save_dir and see identical
              world state — nothing narratively load-bearing lives only in one
              client's conversation context.
        - requirement_priority
        - impact:
              type: reliability
              value: 1
        - work_state: done
    single_shared_source_key:
        - description: >
              Every direct registrar.update() call (core.py, spatial.py) and
              every write through core.registrar_sessions (emc2p's own
              RegistrarSessions) must merge under the same source key
              (emc2p.mcp_server.SOURCE_KEY), or the same alias written from
              two call sites would hash to two different entity_ids and
              silently fork a duplicate entity instead of updating the
              original.
        - requirement_priority
        - impact:
              type: reliability
              value: 0.9
        - work_state: done
    concurrent_readable_registry:
        - description: >
              The registry backend must let a live session's connection stay
              open for the session's whole lifetime while other processes still
              read or write concurrently — rules out a single-file embedded
              database (e.g. DuckDB), which locks out every other connection
              while one process holds it open.
        - requirement_priority
        - impact:
              type: reliability
              value: 0.8
        - work_state: done
    dev_db_bootstrap:
        - description: >
              In a dev/sandbox environment, start_world should self-heal a
              localhost-only Postgres that isn't running yet rather than
              failing outright — a deliberately remote or already-configured
              server must never be touched.
        - requirement_priority
        - impact:
              type: developer_experience
              value: 0.4
        - work_state: done
    scenario_agnostic_reasoning_prompts:
        - description: >
              Any prompt/instruction change meant to improve a responder's
              reasoning (e.g. the recurring arrival-order confusion tracked
              in the parking live test, or a component-choice confusion
              like writing a car's location under `todo` instead of
              `location`) must be a general rule for reasoning through the
              event-resolution process itself -- never something tailored
              to one specific scenario's particular entities or narrative
              (e.g. hard-coding a reminder about a specific car in the
              parking scenario). A scenario-specific hint would defeat the
              purpose of story-simulator being a general-purpose
              simulation, not a fix for one playtest. `resolve_event`'s own
              "nothing with an earlier end_time is still unresolved"
              language is the model to follow: a general rule any scenario
              benefits from, not one keyed to a particular entity or story.
        - requirement_priority
        - impact:
              type: architecture_clarity
              value: 0.5
        - work_state: done
    tool_catalog:
        data:
            - description: The MCP tools story-simulator exposes, and what each must guarantee.
        start_world:
            - description: >
                  Opens or seeds a save_dir'd world, remembered for the session.
                  Must seed only an empty save from scenario_dir/DEFAULT_WORLD_DIR
                  once — a resumed save's accumulated registry state must never
                  be re-merged with the starting scenario on reconnect.
            - requirement_priority
            - impact:
                  type: reliability
                  value: 0.9
            - work_state: done
        view_registry:
            - description: >
                  Markdown dump of every recorded instance of one component
                  type. Delegates to iacs's own Registrar.view_df rather than
                  reimplementing the read logic -- see docs/manifest/
                  history.yaml: project_history.
                  story_simulator_view_tools_reinstated_as_iacs_delegates for
                  why this is a thin wrapper rather than routed through a
                  separate iacs-mcp call.
            - requirement_priority
            - impact:
                  type: reliability
                  value: 0.6
            - work_state: done
        view_entity:
            - description: >
                  Every recorded component instance for one entity, resolved by
                  exact hash, exact alias, or unambiguous path fragment.
                  Delegates to iacs's own Registrar.view_entity rather than
                  reimplementing the traversal -- see docs/manifest/
                  history.yaml: project_history.
                  story_simulator_view_tools_reinstated_as_iacs_delegates.
            - requirement_priority
            - impact:
                  type: reliability
                  value: 0.6
            - work_state: done
        update_registry:
            - description: Merges entity-first YAML into the registry through the same ETL as save files.
            - requirement_priority
            - impact:
                  type: reliability
                  value: 0.9
            - work_state: done
        consolidate_review:
            - description: >
                  Every component type recorded so far, in one call, for the
                  host to review and consolidate anything wrong -- #76's
                  post-write alternative to update_registry's own pre-write
                  preview/confirm flow. Delegates to iacs's own Registrar.
                  summarize_components rather than reimplementing it -- same
                  reason view_registry/view_entity are thin wrappers (see
                  docs/manifest/history.yaml: project_history.
                  story_simulator_view_tools_reinstated_as_iacs_delegates).
            - requirement_priority
            - impact:
                  type: reliability
                  value: 0.6
            - work_state: done
        perceive:
            - description: >
                  Computes nearby entities for a reference alias, tags them
                  active (replacing whatever was previously tagged active), and
                  permanently merges them into that alias's memory (memory only
                  grows; active is a live snapshot). Each candidate's own
                  visibility distance is computed from its size component
                  (falling back to game_config.DEFAULT_ENTITY_SIZE), not a
                  single flat cutoff for every entity — a mountain stays
                  perceptible far beyond a dropped coin, with no artificial
                  floor keeping small objects perceptible regardless of range
                  (a floor was tried and dropped on review: the formula already
                  gives even a 0.02m object ~1.9m of visibility distance on its
                  own). Computed as one relational query (a left join between
                  positions and sizes, then a filter) via ibis, not a Python
                  loop over rows. Fixes a playtesting bug (see
                  project_history.door_visibility_bug_found_playtesting) where
                  a 2m door was narrated as visible from ~2km away.
            - requirement_priority
            - impact:
                  type: reliability
                  value: 0.8
            - work_state: done
        generate_terrain:
            - description: One LiteLLM call inventing terrain for a location with none established, consistent with what's already known.
            - requirement_priority
            - impact:
                  type: gameplay_richness
                  value: 0.6
            - work_state: done
        resolve_physics:
            - description: One LiteLLM call judging the plausible physical outcome of an action not obviously safe to decide directly.
            - requirement_priority
            - impact:
                  type: gameplay_richness
                  value: 0.6
            - work_state: done
        advance_npc_turn:
            - description: >
                  Decides, narrates, and records one NPC's whole turn — the one
                  case with nobody chatting to drive it — via a nested
                  decide-then-(generate_terrain/resolve_physics/update_registry)*
                  loop.
            - requirement_priority
            - impact:
                  type: gameplay_richness
                  value: 0.7
            - work_state: done
    seed_yaml_reflects_live_state:
        - description: >
              An agent that reads a save's YAML directly should see current
              registry state, or at least be clearly warned it can't. Fixed
              by having every update_registry call (including
              advance_npc_turn's own internal one) re-export the registry's
              current state to save_dir/world.yaml, a generated, read-only
              mirror rewritten in full each turn — the original seed YAML
              itself is still never touched. See docs/manifest/history.yaml:
              project_history.seed_yaml_staleness_discovered and
              .seed_yaml_reflects_live_state_fix_landed for the bug/fix
              history. Not fully closed: an agent could still default to
              grepping the frozen seed specifically instead of the live
              world.yaml, or not know world.yaml exists — see
              mcp_instructions_mention_world_yaml.
        - requirement_priority
        - impact:
              type: reliability
              value: 0.6
        - work_state: done
    mcp_instructions_mention_world_yaml:
        - description: >
              CLAUDE.md has accumulated real operational game-level knowledge
              from dev/playtest sessions (that save_dir/world.yaml is a live,
              current mirror of the registry, distinct from the frozen seed —
              see seed_yaml_reflects_live_state), but CLAUDE.md only reaches
              Claude Code sessions in this repo, a narrower audience than
              "whoever is narrating a story-simulator world." Fold the
              game-level entries (not the dev-environment-specific ones, like
              the story-simulator-mcp reload trick or idle-disconnect
              recovery, which belong staying in CLAUDE.md) into the MCP
              server's own `instructions` string in mcp_server.py, which
              reaches any connected MCP client. Needs a periodic pass, not a
              one-time fix, since CLAUDE.md keeps accumulating this kind of
              knowledge.
        - requirement_priority
        - impact:
              type: reliability
              value: 0.3
        - cost:
              type: engineering_hours
              value: 1
        - work_state: new
    ec_defined_agents:
        - description: >
              An entity with an `agent` component (role/model/system_prompt)
              should be usable the same way story_simulator.agents.AgentSpec is
              today from a *.yaml file, letting a world-author define an agent
              (Terrain, Physics, an NPC decision-maker, or their own) inside the
              registry instead of only in a checked-in config file. Needs a
              loader that turns an `agent` entity into an AgentSpec, and an MCP
              tool that dispatches to it. Reserved in manifest/builtins.yaml;
              not read by any code yet.
        - requirement_priority
        - impact:
              - type: gameplay_richness
                value: 0.6
              - type: architecture_clarity
                value: 0.3
        - cost:
              - type: engineering_hours
                value: 10
              - type: regression_risk
                value: 0.3
        - work_state: new
    world_time_concept:
        - description: >
              The simulation had no representation of in-fiction elapsed time
              (day/night, how long a character has walked, the living world's
              "a year forward" door mechanic) independent of the wall-clock
              ordering value (_next_turn_stamp) that only existed to resolve
              which of an entity's position rows is current.

              Position/state/location's ordering field is `time` (in seconds
              since world creation), sourced from whichever `event` was most
              recently popped -- see core._next_time_stamp and
              single_ordering_vocabulary. The old next_due-based mechanism
              this paragraph used to describe is gone entirely
              (manifest/builtins.yaml's next_due component was dead schema,
              removed); still no day/night cycle or calendar, and "how long
              has X been walking" is answerable from `time` deltas but
              nothing surfaces it yet.

              Resolved on 2026-08-19 (docs/manifest/history.yaml:
              project_history.world_clock_persisted): world time used to be
              purely in-process, session-scoped memory (_current_world_time),
              not a registry entity, so it reset on *every* idle-triggered
              MCP disconnect (a routine, expected event per CLAUDE.md's own
              recovery guidance), not just a crash -- risking a
              silently-stale read if an update_registry call landed in the
              narrow reconnect window before the next event pop. Now a
              `world_clock` component (manifest/builtins.yaml) on a fixed
              entity, read via `core._next_time_stamp(registrar)`, so it
              survives a reconnect the same way every other piece of world
              state already does. What remains open here is the day/night
              cycle/calendar/elapsed-time-surfacing scope only, not this
              persistence gap.
        - requirement_priority
        - impact:
              type: gameplay_richness
              value: 0.2
        - cost:
              - type: engineering_hours
                value: 4
              - type: regression_risk
                value: 0.1
        - work_state: in progress
    live_model_test_coverage:
        - description: >
              generate_terrain/resolve_physics/advance_npc_turn's actual LLM
              behavior, and a realistic multi-tool-call play session, should
              have real-model (@pytest.mark.live) coverage, not just
              tool-level tests against a mocked LLM.
        - requirement_priority
        - impact:
              type: reliability
              value: 0.6
        - cost:
              type: engineering_hours
              value: 5
        - work_state: new
    per_provider_credentials:
        - description: >
              Only Anthropic-flavored model: strings get app-specific credential
              handling (resolve_anthropic_api_key). Every other LiteLLM-supported
              provider relies on that provider's own standard env-var discovery;
              there's no general per-user, per-provider credential story yet.

              Sharpened 2026-08-16: today every API key (any provider) is
              stored the same way regardless of who's running the server --
              a plain process environment variable, read straight off the
              host. Before designing the per-provider story above, assess
              whether that storage mechanism itself is still right once
              this isn't just one developer's local env: is a bare env var
              adequate for a shared/hosted deployment (Epic E's stranger-
              distribution options), or does it need something more
              deliberate (a secrets manager, an encrypted per-save
              credential store, a documented rotation story)? Feeds Epic
              D's "no secrets committed" / "auth/session-isolation
              documented" release-checklist bullets and Epic E's
              auth-token-to-save_dir design either way.
        - requirement_priority
        - impact:
              - type: gameplay_richness
                value: 0.2
              - type: reliability
                value: 0.3
        - cost:
              type: engineering_hours
              value: 4
        - work_state: new
    position_render_tool:
        - description: >
              The pre-rebuild VisualizerSystem's SVG position plot has no
              equivalent MCP tool today — a connected agent can't currently get
              a rendered top-down view of the world, only text.
        - requirement_priority
        - impact:
              type: gameplay_richness
              value: 0.5
        - cost:
              - type: engineering_hours
                value: 5
              - type: regression_risk
                value: 0.1
        - work_state: new
    queryable_architecture:
        - description: >
              The project's own architecture and open follow-ups should be
              modeled as requirement/solution entities, not scattered prose, so
              run_dataflow("audit.requirement_coverage")/("audit.traceability")
              can check the project's own design and resolved_impact_cost can
              rank open work instead of re-deriving priorities from memory.
        - requirement_priority
        - impact:
              type: architecture_clarity
              value: 0.8
        - cost:
              type: engineering_hours
              value: 3
        - work_state: done
    no_orphaned_modules:
        - description: >
              story_simulator/mcp_client.py (open_iacs_mcp_session,
              McpToolSession) has had no importer since the turn-pipeline
              removal (acb2956) deleted the Archivist that used it. Either
              delete it or repurpose it for ec_defined_agents (an EC-defined
              agent could plausibly need to talk to iacs-mcp the same way).
        - requirement_priority
        - impact:
              type: architecture_clarity
              value: 0.4
        - cost:
              - type: engineering_hours
                value: 1
              - type: regression_risk
                value: 0.1
        - work_state: new
    config_as_ec_files:
        - description: >
              story_simulator/config.py hardcodes file paths, source
              identifiers, and other project constants in Python rather than
              letting a world-author override them via EC data. Evaluate
              moving as much of that config as reasonably can be into EC
              files instead. Migrated 2026-08-13 from a loose
              `__iacs__ = {"todo": ...}` marker in config.py itself, so this
              backlog note isn't split across code docstrings and the
              manifest.
        - requirement_priority
        - impact:
              type: developer_experience
              value: 0.2
        - cost:
              - type: engineering_hours
                value: 3
              - type: regression_risk
                value: 0.2
        - work_state: new
    event_loop_structure:
        - description: >
              The pop_event/is_event_valid/advance_clock/resolve_event/
              plan_events functions just live loose at module scope in
              core.py. Evaluate whether the event loop deserves a more
              deliberate structure (a class, a dataclass-based state object,
              an explicit stage protocol) as more modules start hooking into
              it, instead of a flat function bag. Migrated 2026-08-13 from a
              loose `__iacs__ = {"todo": ...}` marker in core.py itself
              (which also carries `"solution of":
              story_simulator_mission.stateless_client` -- that part stays
              in the code, only the todo note moved here). Function names
              updated 2026-08-16 to match the event-entity rework
              (predict_next_event/push_event no longer exist).
        - requirement_priority
        - impact:
              type: architecture_clarity
              value: 0.3
        - cost:
              - type: engineering_hours
                value: 4
              - type: regression_risk
                value: 0.3
        - work_state: new
    scd_time_data:
        data:
            - description: >
                  Review of every slowly-changing-dimension/time-ordering
                  object across iacs (the general mechanism) and
                  story-simulator (position/state/next_due/clock), prompted
                  by real duplication found while adding next_due/clock this
                  session: a tie-breaking bug traced to iacs's own
                  Registry.merge/view_current (see
                  deterministic_current_resolution) -- and while scoping a
                  fix, four near-identical turn/time field blocks (position,
                  state, next_due, clock) turned up along the way (see
                  single_ordering_vocabulary). Related to world_time_concept
                  (a still-open sibling requirement asking for a genuine
                  in-fiction-time axis distinct from mere row-ordering) --
                  next_due/clock are this session's first attempt at that
                  axis, not a replacement for evaluating it properly.

                  Impact estimates below were lowered on 2026-08-13: a
                  working solution (zhafen/iacs#94's `_seq_{field}` fix)
                  already resolves the concrete tie-breaking bug that made
                  this cluster urgent, even though it isn't merged yet. What
                  remains open here is naming/architecture cleanup, not an
                  active correctness gap -- kept in this manifest rather
                  than pulled into a GitHub issue, since it's no longer
                  actively worked at that urgency.
        deterministic_current_resolution:
            - description: >
                  Two rows sharing the same time_dimension value must still
                  resolve to exactly one deterministic "current" row --
                  Registry.view_current's row_number() window previously
                  broke ties arbitrarily (backend-dependent), confirmed
                  failing this session (a second update_registry call in
                  the same in-world "turn" silently lost to the first).

                  A `type: time_dimension` shorthand field type was tried
                  first (zhafen/iacs#93) but abandoned -- extra schema-
                  language complexity for a small boilerplate savings, and
                  inaccurate (it hardcoded int, but some time_dimension
                  fields are legitimately float). It also didn't even touch
                  tie-breaking; that gap sat undiscovered in this
                  requirement's own "done" status until directly reproduced.

                  Fixed for real via zhafen/iacs#94 (open, not yet merged):
                  a `_seq_{field}` write-order column, scoped only to
                  component types with a time_dimension field, that
                  Registry.merge assigns to genuinely-new rows (identified
                  via a set difference on every other column, matching the
                  existing union/distinct dedup) and never rewrites once
                  assigned. Registry._current_table breaks a tie via
                  `_seq_{field}` (most-recent-write wins) when present.
                  Known gap, not fixed: a cold reload from an exported save
                  reassigns fresh sequence numbers from scratch rather than
                  truly persisting write order across a session boundary --
                  good enough for the concrete bug (a tie within one
                  continuous session), not a complete fix.
            - requirement_priority
            - impact:
                  type: reliability
                  value: 0.3
            - work_state: in progress
        single_ordering_vocabulary:
            - description: >
                  One name, one schema shape, for "the field that orders
                  which row is current" -- position.turn/state.turn/
                  next_due.turn used `turn`, iacs's own description.time
                  used `time`, and each of the three story-simulator blocks
                  repeated the same ~6-line description/type/nullable/
                  time_dimension declaration almost word for word.

                  Naming half done: position/state/next_due were renamed to
                  `time`, matching iacs's own description.time, so it's one
                  name everywhere now. The schema-shape half (a shorthand
                  field type so a component author writes one line instead
                  of six) was tried as `type: time_dimension`
                  (zhafen/iacs#93) and abandoned -- extra schema-language
                  complexity for a small saving, and inaccurate (hardcoded
                  int, but time is legitimately float here). The three
                  blocks still repeat the boilerplate by hand.
            - requirement_priority
            - impact:
                  type: architecture_clarity
                  value: 0.2
            - cost:
                  type: engineering_hours
                  value: 2
            - work_state: in progress
        no_duplicated_meta_columns:
            - description: >
                  iacs's own "which columns are infrastructure, not user
                  data" concept is defined twice, independently:
                  registry.py's _TABLE_META_COLS and export_manifest.py's
                  _METADATA_COLS. Both needed the same _seq addition by hand
                  this session -- exactly the kind of drift risk a single
                  source of truth would prevent.
            - requirement_priority
            - impact:
                  type: architecture_clarity
                  value: 0.2
            - cost:
                  - type: engineering_hours
                    value: 1
                  - type: regression_risk
                    value: 0.2
            - work_state: new
        honest_function_responsibilities:
            - description: >
                  story_simulator.core.advance_clock (moved from
                  story_simulator.spatial when the base event-loop kernel
                  was split out) reads next_due AND writes the world_clock
                  entity under a name that only advertises reading -- a
                  caller checking "what does this function do" from its
                  name alone would miss the write.
            - requirement_priority
            - impact:
                  type: architecture_clarity
                  value: 0.15
            - cost:
                  type: engineering_hours
                  value: 1
            - work_state: new
        candidate_solutions:
            data:
                - description: >
                      Design options for the requirements above, not yet
                      chosen between -- scored with the same impact/cost
                      vocabulary as everything else in this manifest so
                      resolved_impact_cost can help rank them, but every
                      entry here stays work_state: new until one is picked.
            keep_current_design:
                - description: >
                      Do nothing further -- ship this session's `_seq` fix
                      as-is and leave the rest.

                      PROS: already implemented and fully tested (367 iacs +
                      55 story-simulator tests green); zero further
                      engineering cost; every component's schema stays
                      fully self-contained and explicit, nothing "magic".

                      CONS: the duplication that prompted this review is
                      still there -- four near-copy-pasted turn blocks, two
                      names for one concept, two meta-column lists, one
                      misleadingly-named function; doesn't reduce the bloat
                      this review was asked to address, and `clock` adds a
                      fifth SCD-shaped object rather than fewer.
                - solution of: story_simulator_mission.scd_time_data
                - impact:
                      type: developer_experience
                      value: 0.1
                - cost:
                      type: engineering_hours
                      value: 0
                - work_state: new
            reusable_time_dimension_field_type:
                - description: >
                      Give iacs a first-class shorthand field type (e.g.
                      `type: time_dimension`) that expands to the full
                      int/nullable/time_dimension:true boilerplate plus a
                      standard name, so a component author writes one line
                      instead of six.

                      PROS: kills the duplication at its root, in one place
                      that benefits every iacs consumer, not just
                      story-simulator; naming (turn vs time) becomes
                      standardized by construction, not convention.

                      CONS: an iacs schema-language change, not just a
                      Python fix -- cross-repo, blocked on the open
                      submodule-push question, higher regression risk;
                      standardizing the field name would need a migration
                      for position/state/next_due's existing `turn` fields
                      unless the shorthand allows renaming.
                - solution of: story_simulator_mission.scd_time_data.single_ordering_vocabulary
                - impact:
                      - type: architecture_clarity
                        value: 0.7
                      - type: developer_experience
                        value: 0.3
                - cost:
                      - type: engineering_hours
                        value: 6
                      - type: regression_risk
                        value: 0.4
                - work_state: new
            merge_clock_into_next_due:
                - description: >
                      Stop treating "current world time" and "when is X next
                      due" as two components on two entities -- derive the
                      former from the latter's own accumulated history (or
                      split advance_clock into two honestly-named
                      functions) instead of persisting a separate
                      world_clock entity.

                      PROS: one fewer component type/entity per save;
                      directly removes the clock/next_due duplication this
                      review flagged.

                      CONS: deriving "now" by scanning next_due's full
                      history is less direct than reading one authoritative
                      value, and "highest next_due already resolved" isn't
                      quite the same guarantee as an explicit clock once
                      several entities interleave; doesn't touch the
                      turn/time naming or iacs meta-column duplication.
                - solution of: story_simulator_mission.scd_time_data
                - impact:
                      type: architecture_clarity
                      value: 0.4
                - cost:
                      - type: engineering_hours
                        value: 3
                      - type: regression_risk
                        value: 0.3
                - work_state: new
            drop_scd_semantics_for_schedule_data:
                - description: >
                      next_due/clock don't obviously need "keep full history,
                      collapse to latest" semantics the way position/state
                      do -- only the latest value is ever meaningful. Store
                      them as an ordinary overwritten value (like `active`
                      already is, via Registrar.overwrite) instead of a
                      time_dimension'd component.

                      PROS: removes next_due/clock from the SCD machinery
                      entirely -- no turn field, no view_current dependency,
                      no _seq concern for these two components specifically.

                      CONS: loses the historical trail of how an entity's
                      schedule changed over time (available today via plain
                      view); introduces a second "how do I read current X"
                      idiom alongside the SCD one the rest of the schema
                      uses -- arguably more confusing, not less.
                - solution of: story_simulator_mission.scd_time_data
                - impact:
                      type: architecture_clarity
                      value: 0.2
                - cost:
                      type: engineering_hours
                      value: 2
                - work_state: new
            yaml_anchor_shared_turn_block:
                - description: >
                      Write position/state/next_due/clock's turn field
                      declaration once as a YAML anchor in
                      manifest/builtins.yaml and reference it three more
                      times, rather than four independent copies.

                      PROS: zero code changes, no cross-repo dependency,
                      trivial and low-risk, directly kills the
                      copy-paste-drift complaint immediately.

                      CONS: cosmetic only -- doesn't reduce the runtime
                      concept count (still four separate schemas), doesn't
                      touch the turn/time naming split or iacs's
                      meta-column duplication.
                - solution of: story_simulator_mission.scd_time_data.single_ordering_vocabulary
                - impact:
                      type: architecture_clarity
                      value: 0.2
                - cost:
                      type: engineering_hours
                      value: 0.5
                - work_state: new
            unify_iacs_meta_column_lists:
                - description: >
                      Define iacs's "infrastructure, not data" column set
                      once (in registry.py) and have export_manifest.py
                      reuse it instead of maintaining _METADATA_COLS
                      independently.

                      PROS: directly fixes the exact two-lists-out-of-sync
                      pain hit this session; small, low-risk, no schema or
                      behavior change.

                      CONS: export_manifest.py's list has one entry
                      (is_primary) registry.py's doesn't -- needs a small
                      reconciliation, not a pure rename; still a cross-repo
                      iacs change, blocked on the same submodule-push
                      question as reusable_time_dimension_field_type.
                - solution of: story_simulator_mission.scd_time_data.no_duplicated_meta_columns
                - impact:
                      type: architecture_clarity
                      value: 0.3
                - cost:
                      - type: engineering_hours
                        value: 1
                      - type: regression_risk
                        value: 0.1
                - work_state: new

    live_testing_framework:
        data:
            - description: >
                  Seven concrete requirements for what the live-testing
                  solution (tests/test_human_validated/ in this repo,
                  emc2p.testing/emc2p.testing.expected_fixtures upstream) must
                  actually guarantee.

                  Sharpened after this session's work consolidating
                  test_scenario_resolution.py and dropping the emc2p submodule.
                  Sibling to live_model_test_coverage (a still-open, more
                  general "have real-model coverage at all" requirement) --
                  this subtree is about the shape of the testing solution
                  itself, not just whether coverage exists.

                  requirements/ and candidate_solutions/ are kept at the same
                  nesting depth deliberately -- a requirement only carries
                  impact (what it's worth once satisfied), never cost: we don't
                  know what satisfying an abstract requirement costs in the
                  abstract, only what a specific solution costs. A solution
                  only carries cost (what it costs to build/adopt), never
                  impact: a solution's impact IS the impact of whichever
                  requirement(s) it satisfies (its own `solution of` links),
                  not a separate number to invent per solution.
        requirements:
            data:
                - description: >
                      The seven requirements themselves.

                      See the impact/cost split explained on
                      live_testing_framework's own description above.
            scenario_variety:
                - description: >
                      Must enable testing a variety of scenarios -- adding a
                      new scenario shouldn't require new test-harness code,
                      just new data.

                      Mostly true today: a new scenario is just a new
                      manifest-style scenario_dir plus its own expected.py;
                      iacs's own example_dirs() parametrization and this repo's
                      Case list (test_scenario_resolution.py) both add a
                      scenario as a few lines, not a new file.
                - requirement_priority
                - impact:
                      type: reliability
                      value: 0.4
                - work_state: in progress
            live_agent_behavior_check:
                - description: >
                      Must enable testing how an agent performs live for a
                      given scenario -- a real model, over a real MCP
                      round-trip, reasoning about the scenario itself, not a
                      mocked LLM.

                      Live today via McpClientSession/HeadlessSession
                      (emc2p.testing) and @pytest.mark.live tests, but
                      responder="subagent" isolation is unverified (see the
                      TODO in story_simulator/resolve.py's
                      _frame_for_responder).
                - requirement_priority
                - impact:
                      type: reliability
                      value: 0.6
                - work_state: in progress
            deterministic_machinery_check:
                - description: >
                      Must enable testing how the simulation machinery itself
                      works for a given scenario by accepting pre-determined
                      static input -- isolating "does the mechanism work" from
                      "does the model reason correctly", with no LLM and no
                      cost.

                      Done for one scenario (test_car_parking_deterministic.py,
                      hand-scripted answers driven directly through
                      advance_simulation/update_registry), but not yet folded
                      into the same Case/expected.py framework
                      scenario_variety's other solutions use.
                - requirement_priority
                - impact:
                      type: reliability
                      value: 0.5
                - work_state: in progress
            switchable_test_agent:
                - description: >
                      Must allow the agent executing the process to be switched
                      to and from a CLI from the host (e.g. claude) or a keyed
                      subagent, for now depending on static parameters.

                      No requirement yet that this be chosen dynamically
                      mid-run. Done via HeadlessSession (spawns `claude -p` as
                      a real subprocess) versus McpClientSession's own
                      `responder` construction-time argument
                      ("host"/"subagent"/"keyed_subagent", see
                      story_simulator.keyed_subagent) -- both a static,
                      per-session choice, matching what's asked for here.
                - requirement_priority
                - impact:
                      - type: reliability
                        value: 0.3
                      - type: developer_experience
                        value: 0.2
                - work_state: in progress
            centralized_scenario_authoring:
                - description: >
                      HIGHEST PRIORITY. Must allow the human creators to easily
                      lay out a scenario, the expected values, and test
                      parameters side by side in one centralized location.

                      Humans need to look at what the scenario is and what they
                      expect to come of it together, not reconstruct that
                      pairing by reading several files. Not done today: a
                      scenario's manifest (tests/data/scenarios/<name>/), its
                      expected.py
                      (tests/test_human_validated/expected/<name>.py), and its
                      test parameters (responder, timeouts, turn instructions
                      -- test_scenario_resolution.py's Case list) are three
                      separate locations in two different formats (YAML data,
                      Python data/code).
                - requirement_priority
                - impact:
                      - type: developer_experience
                        value: 0.9
                      - type: architecture_clarity
                        value: 0.4
                - work_state: new
            stepwise_or_completion_execution:
                - description: >
                      Must allow running to completion or turn by turn, for a
                      given scenario -- derived from
                      centralized_scenario_authoring.

                      If humans lay out a scenario/expected-values/parameters
                      together, one of those parameters should be able to say
                      "stop and check after each turn" instead of only "run
                      everything, check the end state". Run-to-completion is
                      done (every current live test sends one open-ended
                      instruction); turn-by-turn against this same framework is
                      not implemented yet.
                - requirement_priority
                - impact:
                      - type: reliability
                        value: 0.3
                      - type: gameplay_richness
                        value: 0.2
                - work_state: in progress
            machinery_lives_in_emc2p:
                - description: >
                      Base machinery must live in emc2p; story-simulator should
                      contain minimal additions built on top, or no additions
                      at all, just scenario definitions.

                      Partially true today: emc2p.testing's own
                      expected_fixtures, headless_session, mcp_client_session,
                      and registry_checks modules are all generic upstream
                      infrastructure, but
                      story_simulator.keyed_subagent (the actual keyed-subagent
                      tool-calling dispatch) and every Case/instruction/checks
                      definition in test_scenario_resolution.py are
                      story-simulator-local Python, not just scenario data.
                - requirement_priority
                - impact:
                      - type: architecture_clarity
                        value: 0.5
                      - type: developer_experience
                        value: 0.2
                - work_state: in progress
        candidate_solutions:
            data:
                - description: >
                      Design options against the seven requirements above --
                      both already-implemented (this session's own work) and
                      still-possible ones.

                      Scored with the same cost vocabulary as everywhere else
                      in this manifest (no impact here -- see
                      live_testing_framework's own description for why) plus
                      plain pro/con bare tags (one per point). Weighted
                      consideration/consideration_rating axes were tried
                      first here but dropped: the weight*rating formula kept
                      producing a sign that didn't match the point's own
                      actual meaning (e.g. a clearly negative point scoring
                      as a net "pro" because its axis and rating happened to
                      multiply positive) -- pure qualitative pro/con is what
                      this project is actually evaluating solutions with
                      while still trying the format out. Every entry stays
                      work_state: new, same convention as
                      scd_time_data.candidate_solutions above: "new" marks a
                      candidate not yet formally settled on, independent of
                      whether it happens to already be implemented.
            mcp_client_session_live_driver:
                - description: >
                      HeadlessSession (a real `claude -p` subprocess) and
                      McpClientSession (any litellm model) as the two
                      live-agent drivers.

                      McpClientSession's own `responder` construction-time
                      argument (via emc2p.agents.tool_calling_loop) picks
                      host/subagent/keyed_subagent.
                - solution of: story_simulator_mission.live_testing_framework.requirements.live_agent_behavior_check
                - solution of: story_simulator_mission.live_testing_framework.requirements.switchable_test_agent
                - cost:
                      type: engineering_hours
                      value: 0
                - pro: Already implemented and exercised by every current live test.
                - pro: Works with any litellm-supported model, not just Claude; responder is a clean static per-session parameter, matching switchable_test_agent's "static parameters" framing exactly.
                - con: Answers labeled "subagent" aren't verified to have actually come from an isolated call (open TODO in resolve.py).
                - con: Two separate session classes to choose between rather than one; switching responder mid-run isn't possible.
                - work_state: new
                - code_example:
                      language: python
                      value: |
                          # Already how every live test picks its agent driver.
                          session = McpClientSession(
                              model="claude-sonnet-5",
                              responder="subagent",  # or "host" / "keyed_subagent"
                          )
                          # HeadlessSession is the other driver: a real `claude -p`
                          # subprocess instead of a litellm-backed model call.
                          session = HeadlessSession(cwd=scenario_dir)
            expected_fixtures_manifest_framework:
                - description: >
                      emc2p.testing.expected_fixtures plus the
                      scenario_dir/expected.py directory-pairing convention,
                      shared by iacs, emc2p, and story-simulator.

                      Provides example_dirs, assert_subset, and
                      ExpectedValueChecker as the actual comparison machinery.
                - solution of: story_simulator_mission.live_testing_framework.requirements.scenario_variety
                - solution of: story_simulator_mission.live_testing_framework.requirements.machinery_lives_in_emc2p
                - solution of: story_simulator_mission.live_testing_framework.requirements.centralized_scenario_authoring
                - cost:
                      type: engineering_hours
                      value: 0
                - pro: Already implemented and exercised by the current scenario_variety/machinery_lives_in_emc2p solutions.
                - pro: Base comparison machinery genuinely lives in emc2p, not just story-simulator.
                - con: For story-simulator specifically, "paired" still means two separate files/directories a human opens one after the other, not one place; test parameters (responder, timeouts, turn instructions) live in a third location (Python).
                - work_state: new
                - code_example:
                      language: python
                      value: |
                          # emc2p.testing.expected_fixtures
                          for scenario_dir, expected in example_dirs(EXAMPLES_ROOT):
                              registry = run_scenario(scenario_dir)
                              checker = ExpectedValueChecker(registry)
                              assert_subset(checker, expected.EXPECTED)
            deterministic_hand_scripted_harness:
                - description: >
                      test_car_parking_deterministic.py's own approach: drive
                      advance_simulation/update_registry directly, in-process,
                      with hand-written "perfect" answers.

                      No LLM, no MCP round-trip, no cost.
                - solution of: story_simulator_mission.live_testing_framework.requirements.deterministic_machinery_check
                - cost:
                      type: engineering_hours
                      value: 0
                - pro: Already implemented and exercised today.
                - pro: Fully deterministic and fast; isolates mechanism bugs from model-reasoning failures exactly as deterministic_machinery_check asks; checks exact prompt text and resume_token bookkeeping a live test can't easily assert on.
                - con: One bespoke test function per scenario today, not wired into the shared Case/expected.py framework.
                - work_state: new
                - code_example:
                      language: python
                      value: |
                          # test_car_parking_deterministic.py's own shape.
                          registrar = Registrar.from_manifest([scenario_dir])
                          registrar.update({"description": [...]})  # hand-written "perfect" turn
                          registry = advance_simulation(registrar, instruction="park the car")
                          assert registry.get("state").execute()["value"].iloc[-1] == "parked"
            hand_scripted_harness_for_everything:
                - description: >
                      Possible, not yet built: generalizes
                      deterministic_hand_scripted_harness beyond
                      deterministic-only scenarios and replaces expected.py
                      entirely. One hand-written test function per scenario
                      holds everything expected.py currently holds --
                      scenario setup, turn instructions, and checks
                      together, in plain Python. No Case/CASES list, no
                      separate data file, no parametrize decorator.
                - solution of: story_simulator_mission.live_testing_framework.requirements.centralized_scenario_authoring
                - solution of: story_simulator_mission.live_testing_framework.requirements.stepwise_or_completion_execution
                - solution of: story_simulator_mission.live_testing_framework.requirements.deterministic_machinery_check
                - solution of: story_simulator_mission.live_testing_framework.requirements.live_agent_behavior_check
                - cost:
                      type: engineering_hours
                      value: 6
                - pro: Pure Python -- no new DSL/data format to design, parse, or learn; reuses the language everyone already knows.
                - pro: Self-evident and easy to read -- the whole scenario's logic sits in one function, nothing to cross-reference.
                - con: A scenario's test function can grow very large as more turns/checks are added, with nothing forcing it to stay organized.
                - work_state: new
                - code_example:
                      language: python
                      value: |
                          # Pseudocode: one hand-written function replaces Case + expected.py.
                          def test_car_parking(session):
                              registry = session.start_world(scenario_dir="data/scenario_seeds/parking_lot")
                              registry = session.advance(registry, "drive to the spot")
                              registry = session.advance(registry, "park the car")
                              assert registry.get("state").execute()["value"].iloc[-1] == "parked"
            case_dataclass_parametrization:
                - description: >
                      test_scenario_resolution.py's own Case dataclass + CASES
                      list.

                      One @pytest.mark.parametrize test function, each case a
                      scenario_dir/instruction/checks tuple.
                - solution of: story_simulator_mission.live_testing_framework.requirements.scenario_variety
                - solution of: story_simulator_mission.live_testing_framework.requirements.stepwise_or_completion_execution
                - cost:
                      type: engineering_hours
                      value: 0
                - pro: Already implemented; adding a run-to-completion scenario is a few lines, not a new file (proven with the race/parking_split consolidation).
                - pro: Reuses expected_fixtures_manifest_framework's comparison machinery directly.
                - con: Only covers run-to-completion, not turn-by-turn (stepwise_or_completion_execution is still open).
                - con: Checks are separated from the definitions, and from each other.
                - con: We'll end up with one giant list of cases.
                - con: No particularly good motivation to parameterize here -- the pattern this was modeled on parameterizes because it applies the same set of transformations to every example and confirms each still works; that's not really our situation, so this risks being overengineered.
                - work_state: new
                - code_example:
                      language: python
                      value: |
                          # test_scenario_resolution.py's own shape.
                          @dataclass
                          class Case:
                              scenario_dir: Path
                              instruction: str
                              checks: Callable[[Registry], None]

                          CASES = [
                              Case("car_parking", "park the car", check_car_parked),
                              Case("race_placement", "run the race", check_race_placements),
                          ]

                          @pytest.mark.parametrize("case", CASES, ids=lambda c: c.scenario_dir.name)
                          def test_scenario(case): ...
            turn_list_case_extension:
                - description: >
                      Possible, not yet built: change Case.instruction: str to
                      Case.turns: list[Turn], each Turn a (instruction, checks)
                      pair.

                      expected.py would grow named checkpoint attributes (e.g.
                      event_state_after_drive) for whichever turns want a
                      check.
                - solution of: story_simulator_mission.live_testing_framework.requirements.stepwise_or_completion_execution
                - cost:
                      type: engineering_hours
                      value: 3
                - pro: Smallest change that actually enables stepwise_or_completion_execution; reuses every existing helper (assert_subset, _assert_write_order) unchanged; a single-turn Case degrades to today's exact behavior.
                - con: Doesn't touch centralized_scenario_authoring -- turns/checks still live in test_scenario_resolution.py, not a human-editable central file.
                - con: A scenario needing many checkpoints means many hand-written per-turn lambdas, the same duplication risk the original consolidation removed.
                - con: No particularly good motivation to parameterize here -- the pattern this was modeled on parameterizes because it applies the same set of transformations to every example and confirms each still works; that's not really our situation, so this risks being overengineered.
                - work_state: new
                - code_example:
                      language: python
                      value: |
                          # Pseudocode: Case grows a turns list instead of one instruction.
                          @dataclass
                          class Turn:
                              instruction: str
                              checks: Callable[[Registry], None] | None = None

                          @dataclass
                          class Case:
                              scenario_dir: Path
                              turns: list[Turn]  # was: instruction: str

                          Case("car_parking", turns=[
                              Turn("drive to the spot"),
                              Turn("park the car", check_car_parked),  # only this turn is checked
                          ])
            data_driven_step_script:
                - description: >
                      Possible, not yet built: expected.py grows a `steps` list
                      (each step a dict of instruction + named-field expected
                      values).

                      One fully generic step-runner (in emc2p.testing, ideally)
                      zips through it, dispatching each named field to the
                      right reader/leniency rule via a lookup table.
                - solution of: story_simulator_mission.live_testing_framework.requirements.stepwise_or_completion_execution
                - solution of: story_simulator_mission.live_testing_framework.requirements.centralized_scenario_authoring
                - cost:
                      - type: engineering_hours
                        value: 5
                      - type: regression_risk
                        value: 0.2
                - pro: Maximizes reuse -- a new step-by-step scenario becomes "write expected.py data", not "write test code"; pushes the step-runner itself into emc2p, strengthening machinery_lives_in_emc2p.
                - pro: Closest fit to centralized_scenario_authoring of anything here short of single_scenario_yaml_file.
                - con: Needs a var-name -> reader/leniency-rule dispatch table, which just relocates case_dataclass_parametrization's per-field special-casing rather than removing it.
                - con: Blurs expected.py's job (today -- pure expected values) into also being the test script; flat data instructions lose room for the scenario-specific narrative framing this codebase's prompts rely on.
                - con: Yet another data format to fit scenario/instruction/checks content into, on top of the shapes the other candidate solutions already use.
                - con: No particularly good motivation to parameterize here -- the pattern this was modeled on parameterizes because it applies the same set of transformations to every example and confirms each still works; that's not really our situation, so this risks being overengineered.
                - work_state: new
                - code_example:
                      language: python
                      value: |
                          # Pseudocode: expected.py grows a data-driven steps list.
                          STEPS = [
                              {"instruction": "drive to the spot", "expected": {}},
                              {"instruction": "park the car", "expected": {"state": "parked"}},
                          ]

                          # emc2p.testing's generic step-runner, driven by field name:
                          READERS = {"state": read_state, "position": read_position}

                          def run_steps(registry, steps):
                              for step in steps:
                                  registry = advance_simulation(registry, step["instruction"])
                                  for field, expected_value in step["expected"].items():
                                      assert READERS[field](registry) == expected_value
            single_scenario_yaml_file:
                - description: >
                      Possible, not yet built: one data file per scenario (e.g.
                      tests/scenarios/<name>/test_case.yaml) holding the
                      scenario manifest, ordered turn instructions, expected
                      values, and test parameters all together.

                      A small generic loader/runner would live in
                      emc2p.testing, with story-simulator supplying only the
                      data file.
                - solution of: story_simulator_mission.live_testing_framework.requirements.centralized_scenario_authoring
                - solution of: story_simulator_mission.live_testing_framework.requirements.stepwise_or_completion_execution
                - solution of: story_simulator_mission.live_testing_framework.requirements.machinery_lives_in_emc2p
                - cost:
                      - type: engineering_hours
                        value: 8
                      - type: regression_risk
                        value: 0.3
                - pro: Closest realization of centralized_scenario_authoring's literal ask (one place, side by side).
                - pro: Generalizes naturally to stepwise_or_completion_execution (a `steps:` list) and scenario_variety (variety = new directories); keeps machinery_lives_in_emc2p by construction (the loader is the only code, and it's upstream).
                - con: Real new engineering -- a small schema/DSL to design, parse, and validate, not a refactor of existing code.
                - con: Instruction text authored as flat data loses Python's f-string templating; the "which reader/leniency rule applies to which field" question doesn't go away, it just moves into the new loader's own vocabulary.
                - con: No particularly good motivation to parameterize here -- the pattern this was modeled on parameterizes because it applies the same set of transformations to every example and confirms each still works; that's not really our situation, so this risks being overengineered.
                - work_state: new
                - code_example:
                      language: yaml
                      value: |
                          # Pseudocode: tests/scenarios/car_parking/test_case.yaml
                          scenario: {inherits: data/scenario_seeds/parking_lot}
                          responder: subagent
                          timeout_seconds: 120
                          turns:
                              - instruction: drive to the spot
                              - instruction: park the car
                                expected:
                                    state: parked
            human_review_doc_generator:
                - description: >
                      Possible, not yet built: keep
                      scenario/expected/parameters as separate files exactly as
                      today, but auto-generate one per-scenario human-facing
                      doc (e.g. Markdown) laying out the scenario input,
                      instructions, and expected values side by side.

                      Regenerated from the existing sources so it can't drift.
                - solution of: story_simulator_mission.live_testing_framework.requirements.centralized_scenario_authoring
                - cost:
                      type: engineering_hours
                      value: 2
                - pro: Zero regression risk, machinery_lives_in_emc2p entirely untouched.
                - pro: Directly and cheaply satisfies the "review side by side" half of centralized_scenario_authoring.
                - con: Doesn't change how a human authors a scenario -- still edits three files/formats even if they can review one generated doc.
                - con: Needs its own small generator to keep the doc in sync; doesn't move stepwise_or_completion_execution or scenario_variety forward at all.
                - con:
                      value: >
                          The whole point of the human-validated tests is to
                          look at actual code that executes and confirm it's
                          functioning -- wrapping that in a generated review
                          doc defeats the purpose.
                      disabling: true
                - work_state: new
                - code_example:
                      language: python
                      value: |
                          # Pseudocode: regenerated from the existing sources, never hand-edited.
                          def generate_review_doc(scenario_dir, expected_module):
                              scenario = load_scenario(scenario_dir)
                              lines = [f"# {scenario_dir.name}", "", "## Scenario", scenario.summary]
                              lines += ["## Expected", *format_expected(expected_module.EXPECTED)]
                              (scenario_dir / "REVIEW.md").write_text("\n".join(lines))
        human_validated_test_framework:
            data:
                - solution
                - description: >
                      Redesign of this same solution using an alternating
                      nested requirement/solution tree (matching iacs's own
                      have_a_good_scoring_system sketch) instead of the
                      mirrored requirements:/candidate_solutions: trees
                      above: this solution nests the requirement(s) it
                      still needs to fill, and each requirement nests its
                      own candidate solutions, one of which eventually gets
                      selected: true.

                      The requirements below are the same seven already
                      established above, copied over unchanged (still
                      accurate) plus one new one (readability). Their
                      candidate solutions are being redescribed fresh here
                      -- it wasn't clear how the old solutions above
                      actually met these requirements. Still being
                      narrated; the trees above are kept as source
                      material to fold into this one, not yet reconciled.
            scenario_variety:
                - description: >
                      Must enable testing a variety of scenarios -- adding a
                      new scenario shouldn't require new test-harness code,
                      just new data.

                      Mostly true today: a new scenario is just a new
                      manifest-style scenario_dir plus its own expected.py;
                      iacs's own example_dirs() parametrization and this repo's
                      Case list (test_scenario_resolution.py) both add a
                      scenario as a few lines, not a new file.
                - requirement
                - requirement_priority
                - impact:
                      type: reliability
                      value: 0.4
                - work_state: in progress
            live_agent_behavior_check:
                data:
                    - description: >
                          Must enable testing how an agent performs live for a
                          given scenario -- a real model, over a real MCP
                          round-trip, reasoning about the scenario itself, not a
                          mocked LLM.

                          Live today via McpClientSession/HeadlessSession
                          (emc2p.testing) and @pytest.mark.live tests, but
                          responder="subagent" isolation is unverified (see the
                          TODO in story_simulator/resolve.py's
                          _frame_for_responder).
                    - requirement
                    - requirement_priority
                    - impact:
                          type: reliability
                          value: 0.6
                    - work_state: in progress
                live_agent_fixtures:
                    data:
                        - description: >
                              Fixtures enabling live-agent tests to be
                              written inline as regular Python code --
                              McpClientSession/HeadlessSession usage wrapped
                              up as reusable fixtures, rather than a
                              Case/CASES parametrized list.
                        - solution
                    general_headless_execution:
                        - description: >
                              A general, reusable way to run a scenario
                              headless -- what live_agent_fixtures itself
                              needs in order to work, independent of any one
                              specific test.
                        - requirement
                        - requirement_priority
            deterministic_machinery_check:
                data:
                    - description: >
                          Must enable testing how the simulation machinery itself
                          works for a given scenario by accepting pre-determined
                          static input -- isolating "does the mechanism work" from
                          "does the model reason correctly", with no LLM and no
                          cost.

                          Done for one scenario (test_car_parking_deterministic.py,
                          hand-scripted answers driven directly through
                          advance_simulation/update_registry), but not yet folded
                          into the same Case/expected.py framework
                          scenario_variety's other solutions use.
                    - requirement
                    - requirement_priority
                    - impact:
                          type: reliability
                          value: 0.5
                    - work_state: in progress
                plain_python_test_files:
                    - description: >
                          Plain Python test files -- ordinary test functions
                          driving advance_simulation/update_registry
                          directly, no Case/CASES list, no data format.
                          (Sketched earlier, above, as
                          hand_scripted_harness_for_everything -- same idea,
                          scoped here specifically to the deterministic case.)
                    - solution
            switchable_test_agent:
                data:
                    - description: >
                          Must allow the agent executing the process to be switched
                          to and from a CLI from the host (e.g. claude) or a keyed
                          subagent, for now depending on static parameters.

                          No requirement yet that this be chosen dynamically
                          mid-run. Done via HeadlessSession (spawns `claude -p` as
                          a real subprocess) versus McpClientSession's own
                          `responder` construction-time argument
                          ("host"/"subagent"/"keyed_subagent", see
                          story_simulator.keyed_subagent) -- both a static,
                          per-session choice, matching what's asked for here.
                    - requirement
                    - requirement_priority
                    - impact:
                          - type: reliability
                            value: 0.3
                          - type: developer_experience
                            value: 0.2
                    - work_state: in progress
                agent_switching_fixtures:
                    - description: >
                          Fixtures in emc2p exposing the responder choice
                          (host/subagent/keyed_subagent) as a plain fixture
                          parameter, rather than something wired into a
                          Case/CASES list.
                    - solution
            centralized_scenario_authoring:
                data:
                    - description: >
                          HIGHEST PRIORITY. Must allow the human creators to easily
                          lay out a scenario, the expected values, and test
                          parameters side by side in one centralized location.

                          Humans need to look at what the scenario is and what they
                          expect to come of it together, not reconstruct that
                          pairing by reading several files. Not done today: a
                          scenario's manifest (tests/data/scenarios/<name>/), its
                          expected.py
                          (tests/test_human_validated/expected/<name>.py), and its
                          test parameters (responder, timeouts, turn instructions
                          -- test_scenario_resolution.py's Case list) are three
                          separate locations in two different formats (YAML data,
                          Python data/code).
                    - requirement
                    - requirement_priority
                    - impact:
                          - type: developer_experience
                            value: 0.9
                          - type: architecture_clarity
                            value: 0.4
                    - work_state: new
                single_scenarios_and_tests_directories:
                    - description: >
                          A single easy-to-locate directory for the scenarios,
                          and a single easy-to-locate directory for the
                          tests, both inside test_human_validated/. The
                          current solution.
                    - solution
                    - solution of: human_validated_test_framework.scenario_variety
                    - work_state: done
                per_scenario_directory_with_tests_and_yaml:
                    - description: >
                          Inside test_human_validated/, a test_scenarios/
                          directory with one directory per scenario, each
                          holding a tests.py (or similarly named) file
                          alongside its own scenario.yaml.
                    - solution
                    - solution of: human_validated_test_framework.scenario_variety
                    - work_state: new
            stepwise_or_completion_execution:
                data:
                    - description: >
                          Must allow running to completion or turn by turn, for a
                          given scenario -- derived from
                          centralized_scenario_authoring.

                          If humans lay out a scenario/expected-values/parameters
                          together, one of those parameters should be able to say
                          "stop and check after each turn" instead of only "run
                          everything, check the end state". Run-to-completion is
                          done (every current live test sends one open-ended
                          instruction); turn-by-turn against this same framework is
                          not implemented yet.
                    - requirement
                    - requirement_priority
                    - impact:
                          - type: reliability
                            value: 0.3
                          - type: gameplay_richness
                            value: 0.2
                    - work_state: in progress
                story_simulator_turn_fixtures:
                    - description: >
                          Fixtures for turn-by-turn/stepwise execution live
                          in story-simulator itself, not emc2p -- turns/steps
                          are a story-simulator-specific data format, not a
                          generic emc2p concern (self-corrected from an
                          earlier "put it in emc2p too" narration pass).
                    - solution
            avoid_duplicated_machinery:
                data:
                    - description: >
                          Revised from an earlier draft of this same
                          requirement (machinery_lives_in_emc2p, in the
                          trees above) -- that framing was really describing
                          a solution, not the requirement itself. The actual
                          requirement: machinery that's going to be reused
                          across scenarios/tests must live in one central
                          location, not be duplicated across call sites.

                          Partially true today: emc2p.testing's own
                          expected_fixtures, headless_session,
                          mcp_client_session, and registry_checks modules
                          are all generic upstream infrastructure, but
                          story_simulator.keyed_subagent (the actual
                          keyed-subagent tool-calling dispatch) and every
                          Case/instruction/checks definition in
                          test_scenario_resolution.py are
                          story-simulator-local Python, not just scenario
                          data.
                    - requirement
                    - requirement_priority
                    - impact:
                          - type: architecture_clarity
                            value: 0.5
                          - type: developer_experience
                            value: 0.2
                    - work_state: in progress
                everything_lives_in_emc2p:
                    - description: >
                          All reused machinery, including turn/step
                          fixtures, lives in emc2p.
                    - solution
                split_fixtures_between_emc2p_and_story_simulator:
                    - description: >
                          Live-agent and deterministic fixtures live in
                          emc2p; run-to-completion/stepwise fixtures live in
                          story-simulator, since turns/steps are a
                          story-simulator-specific data format (see
                          story_simulator_turn_fixtures under
                          stepwise_or_completion_execution above).
                    - solution
            readability:
                data:
                    - description: >
                          New requirement, surfaced only once the
                          alternating-tree redesign started: the test code
                          itself must be easy to read and not full of
                          repeated boilerplate.
                    - requirement
                    - requirement_priority
                shared_pytest_fixtures:
                    - description: Fixtures to minimize repeated code.
                    - solution
                native_python_test_format:
                    - description: Native Python standard test format.
                    - solution

# What satisfies each done (or partially done) requirement. Most solutions
# now live as `__iacs__ = {"solution of": ...}` metadata in Python docstrings.

shared_world_file_id:
    - solution of: story_simulator_mission.single_shared_source_key

architecture_manifest_solution:
    - description: >
          This manifest (story-simulator.yaml + history.yaml), modeling the
          project as requirement/solution entities scored for cost-vs-impact.
    - solution of: story_simulator_mission.queryable_architecture

# Concepts already implemented in manifest/builtins.yaml's event_components
# without a backing requirement -- each carries a `todo` to resolve this.

outcome_progress_interruption_semantics:
    - description: >
          outcome.progress's field description currently says "how far the
          resolution leaves the event's own lifecycle", but its real shape
          is closer to "the outcome given a particular event_state" --
          e.g. what "interrupted" concretely produces is a different kind
          of outcome than "complete", and nobody has decided how that
          should work yet. Deliberately set aside rather than designed
          under time pressure.
    - todo:
          value: >
              Decide outcome.progress/event_state's real interruption
              semantics (what "interrupted" concretely produces, and
              whether outcome.progress should be reframed as "the outcome
              given a particular event_state"), or drop "interrupted" from
              the vocabulary if it turns out not to be needed.
          priority: 0.3

involved_entity_unused:
    - description: >
          involved_entity (manifest/builtins.yaml event_components) lets an
          event link to the entities it concerns, but nothing reads that
          link today -- resolve_event/plan_events tell the responder to
          look it up, but no code scopes anything by it.
    - todo:
          value: >
              Give involved_entity a real functional use (e.g. scoping what
              resolve_event/plan_events look up), or remove it if it turns
              out not to be needed.
          priority: 0.2
