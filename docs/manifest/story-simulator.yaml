                          test_scenario.py holds both a deterministic and
                          a live walkthrough class, sharing one
                          scenario.yaml -- formerly a separate
                          parking_split directory, merged in once the
                          split-events version superseded the original
                          combined-trip one entirely); location_write_isolated stays at
                          tests/data/scenarios/ since it's used by
                          tests/location_write_harness.py, a standalone
                          debug script, not a pytest test case.
                    - location: tests/test_human_validated/test_scenarios/
                    - work_state: done
                responder:
                    - description: >
                          Exposes the responder choice (host/subagent/
                          keyed_subagent) as a plain, parametrizable
                          pytest fixture, in
                          tests/test_human_validated/conftest.py. Not an
                          emc2p-generic McpClientSession/HeadlessSession
                          constructor argument (those classes take no
                          such argument):
                          test_human_validated.helpers._session_extra_env
                          already resolves a responder value (explicit
                          argument, else STORY_SIM_LIVE_TEST_RESPONDER,
                          else DEFAULT_LIVE_TEST_RESPONDER) into a
                          STORY_SIM_RESPONDER env var. The fixture itself
                          is built via
                          emc2p.testing.responder_fixture.make_responder_fixture
                          (that same explicit-param/env-var/default
                          resolution generalized there, since any
                          downstream project's own live-test suite needs
                          the identical shape) -- this project's own
                          conftest.py just supplies its own env var
                          name/default, parametrizing per-test via
                          `@pytest.mark.parametrize("responder", [...],
                          indirect=True)` rather than only being able to
                          flip the whole suite's default through the env
                          var.
                    - location: test_human_validated.conftest.responder
                    - work_state: done
                turn_stepper:
                    - description: >
                          Turn-by-turn (stepwise) test execution and
                          assertions, alongside today's run-to-completion
                          tests, in
                          tests/test_human_validated/conftest.py: sends
                          each turn in a list one at a time, running an
                          optional check after every step. Lives in
                          story-simulator itself, not emc2p -- turns/
                          steps are a story-simulator-specific data
                          format. Not yet exercised by an actual live
                          scenario test (that's separate, larger work --
                          picking a scenario and writing the live test
                          itself), but the fixture itself is built and
                          unit-tested.
                    - location: test_human_validated.conftest.turn_stepper
                    - work_state: done
                scenario_registrar:
                    - description: >
                          Formerly a fixture in
                          tests/test_human_validated/conftest.py wrapping
                          a private helper, test_human_validated.helpers.
                          _load_registrar, that confirmed a save_dir's
                          schema actually existed before loading it.
                          Both were removed: the existence check only
                          ever bought a friendlier error message for the
                          "the model never actually called start_world"
                          case, not a different test outcome (a missing
                          write already reads back as None either way,
                          which every caller's own check already treats
                          as a failure), so every scenario's
                          test_scenario.py now calls
                          Registrar.load(registry_url(save_dir)) directly
                          instead.
                    - location: test_human_validated.helpers
                    - work_state: done

    fast_candidate_entity_resolution:
        data:
            - description: >
                  Registry._resolve_aliases (and get_entity_id, and
                  emc2p.dataflows.derive.resolve_same_as/resolve_paths)
                  each call emc2p.utils.candidate_entity_ids once per
                  row/alias in a Python loop, rather than as a single
                  relational operation. candidate_entity_ids itself
                  lives in emc2p, not this repo, but the boilerplate/perf
                  pain that surfaced this requirement was noticed here,
                  in story-simulator's own call patterns -- matching
                  scd_time_data's cross-repo framing above.
            - requirement
            - requirement_priority
            - impact:
                  type: architecture_clarity
                  value: 0.5
            - work_state: in progress

        add_batch_relational_resolution:
            - description: >
                  Add candidate_entity_ids_batch(user_paths,
                  entity_id_table) -> dict[str, list[str]] to
                  emc2p/utils.py -- one candidate list per input ref (not
                  a flattened union), so per-ref ambiguity/mismatch stays
                  identifiable. Tiers 1-2 (exact hash, exact alias)
                  become real relational joins instead of N boolean-mask
                  scans; tier 3 (substring/path-contains) scopes its
                  inherently N x M cost to only the refs left unresolved
                  after tiers 1-2, run once instead of redundantly per
                  single-ref call. Turn candidate_entity_ids (singular)
                  into a thin wrapper --
                  candidate_entity_ids_batch([user_path],
                  entity_id_table)[user_path] -- keeping existing
                  signature/tests/callers untouched. Rewrite
                  Registry._resolve_aliases to call the batch function
                  once and loop only over the returned dict to warn
                  exactly as today, one relational pass instead of N.
                  New direct tests for candidate_entity_ids_batch (each
                  tier, mixed-tier batch, duplicate refs, empty input);
                  existing candidate_entity_ids/_resolve_aliases suites
                  must pass unchanged as proof the wrapper is
                  behavior-preserving. A raise_on_mismatch option
                  (instead of warn-only) was considered and explicitly
                  deferred, not built now.
            - solution:
                  selected: true
            - pro: >
                  O(N+M) relational joins replace N separate
                  boolean-mask scans for the exact-hash/exact-alias
                  tiers -- the same performance shape as perceive's own
                  left-join-then-filter rewrite (see perceive in
                  tool_catalog above).
            - pro: >
                  candidate_entity_ids keeps its existing signature as a
                  thin wrapper, so no caller or test needs to change to
                  pick up the speedup.
            - con: >
                  Tier 3 (substring/path-contains) is inherently N x M
                  and isn't reduced to a plain join -- only scoped to
                  fewer rows and run once instead of per-call; may still
                  need pushing down to a real LIKE-based join in DuckDB
                  if it's the remaining bottleneck (not attempted in
                  this pass).
            - work_state: new

        migrate_remaining_per_row_loops:
            - description: >
                  resolve_same_as.py's .iterrows() and
                  resolve_paths.py's .apply(..., axis=1) are two more
                  per-row candidate_entity_ids call sites, deliberately
                  left for a follow-up pass rather than this one: each
                  row needs its own single resolved candidate folded
                  into a new column, not a flat {ref: candidates} dict,
                  so migrating them is a separate, smaller change once
                  the batch function exists.
            - todo:
                  value: >
                      Migrate resolve_same_as.py and resolve_paths.py's
                      own per-row candidate_entity_ids loops onto
                      candidate_entity_ids_batch once it exists.
                  priority: 0.3

        single_alias_usage_survey:
            - description: >
                  Open question from this session's review, not yet
                  investigated: are there real usages of
                  candidate_entity_ids for a single alias, as opposed to
                  being called once-per-item inside a loop over many?
                  Bears on whether keeping a singular wrapper is worth
                  it at all, versus every caller just using the batch
                  function directly (even for N=1).
            - todo:
                  value: >
                      Survey every candidate_entity_ids call site
                      (registry.py's two, resolve_same_as.py,
                      resolve_paths.py) for whether any calls it for a
                      genuinely single alias rather than once per
                      row/item in a loop -- decide whether the singular
                      wrapper earns its keep.
                  priority: 0.2

        call_site_formatting_survey:
            - description: >
                  Open question from this session's review, not yet
                  investigated: what is the full spectrum of
                  formatting/preprocessing applied to
                  candidate_entity_ids' input and output across all its
                  callers? E.g. str() coercion, filtering out the
                  entity's own id from candidates, uniqueness
                  assumptions, NaN/None handling before the call --
                  needed so the batched version's contract doesn't
                  silently drop something a caller currently relies on.
            - todo:
                  value: >
                      Survey candidate_entity_ids' input/output handling
                      across registry.py's two call sites,
                      resolve_same_as.py, and resolve_paths.py (str()
                      coercion, self-id filtering, uniqueness, NaN/None
                      handling) before finalizing
                      candidate_entity_ids_batch's contract.
                  priority: 0.2

# What satisfies each done (or partially done) requirement. Most solutions
# now live as `__iacs__ = {"solution of": ...}` metadata in Python docstrings.

shared_world_file_id:
    - solution of: story_simulator_mission.single_shared_source_key

architecture_manifest_solution:
    - description: >
          This manifest (story-simulator.yaml + history.yaml), modeling the
          project as requirement/solution entities scored for cost-vs-impact.
    - solution of: story_simulator_mission.queryable_architecture

# Concepts already implemented in manifest/builtins.yaml's event_components
# without a backing requirement -- each carries a `todo` to resolve this.

outcome_progress_interruption_semantics:
    - description: >
          outcome.progress's field description currently says "how far the
          resolution leaves the event's own lifecycle", but its real shape
          is closer to "the outcome given a particular event_state" --
          e.g. what "interrupted" concretely produces is a different kind
          of outcome than "complete", and nobody has decided how that
          should work yet. Deliberately set aside rather than designed
          under time pressure.
    - todo:
          value: >
              Decide outcome.progress/event_state's real interruption
              semantics (what "interrupted" concretely produces, and
              whether outcome.progress should be reframed as "the outcome
              given a particular event_state"), or drop "interrupted" from
              the vocabulary if it turns out not to be needed.
          priority: 0.3

involved_entity_unused:
    - description: >
          involved_entity (manifest/builtins.yaml event_components) lets an
          event link to the entities it concerns, but nothing reads that
          link today -- resolve_event/plan_events tell the responder to
          look it up, but no code scopes anything by it.
    - todo:
          value: >
              Give involved_entity a real functional use (e.g. scoping what
              resolve_event/plan_events look up), or remove it if it turns
              out not to be needed.
          priority: 0.2
