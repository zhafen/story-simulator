object:
    - description: Base component for inanimate objects.
    - component_type
    - field:
        type:
            description: The type of object, e.g. "door".
            type: str

physics_components:
    position:
        - description: Component containing the position of an entity.
        - component_type
        - field:
            x:
                description: X position in meters, relative to the origin. On a standard
                    map, x would be east (positive) and west (negative).
                type: float
                nullable: false
            y:
                description: Y position in meters, relative to the origin. On a standard
                    map, y would be north (positive) and south (negative).
                type: float
                nullable: false
            z:
                description: Z position in meters, relative to the origin. On a standard map, z would be out of the map/up (positive) and into the map/down (negative).
                type: float
                nullable: false
                default: 0
            time:
                description: World time (seconds since world creation) this
                    position was recorded at, backfilled on merge (see
                    story_simulator.core._next_time_stamp), not authored
                    directly, so it stays nullable for hand-authored rows.
                    Entities can accumulate multiple position rows over time;
                    flagged time_dimension so Registry.view_current resolves
                    the row with the highest time as the current position.
                type: float
                nullable: true
                time_dimension: true
                units: seconds
    velocity:
        - description: Component containing the velocity of an entity, in the
            same x/y/z axes as `position`. Zero for anything at rest.
        - component_type
        - field:
            x:
                description: X velocity in meters/second (east positive).
                type: float
                nullable: false
                default: 0
            y:
                description: Y velocity in meters/second (north positive).
                type: float
                nullable: false
                default: 0
            z:
                description: Z velocity in meters/second (up positive).
                type: float
                nullable: false
                default: 0
            time:
                description: World time (seconds since world creation) this
                    velocity was recorded at, backfilled on merge (see
                    story_simulator.core._next_time_stamp). Flagged
                    time_dimension so Registry.view_current resolves the
                    row with the highest time as the current velocity.
                type: float
                nullable: true
                time_dimension: true
                units: seconds
    dimensions:
        - description: The entity's size, in meters, along its own axes -- x
            is the entity's forward direction (a car's length), y its side
            to side (a car's width), z its height. Until there's an
            orientation component, every entity counts as facing +x (east),
            so these axes line up with `position`'s. The entity is a box
            centered on `position` in x and y, resting on it in z (it spans
            position.z to position.z + dimensions.z). Two solid entities
            (both with `mass`) collide when their boxes overlap; a solid
            entity is inside a region (no `mass`) when its box lies entirely
            within the region's. See story_simulator/physics.py.
        - component_type
        - field:
            x:
                description: Length along the forward axis, in meters.
                type: float
            y:
                description: Width (side to side), in meters.
                type: float
            z:
                description: Height, in meters.
                type: float
    mass:
        - description: The entity's mass, in kilograms. Entities without a
            mass (e.g. a parking spot) are regions, not solid bodies, and
            never collide with each other.
        - component_type
        - field:
            value:
                description: The mass in kilograms.
                type: float

event_components:
    event:
        - description: >
            A scheduled or ongoing occurrence -- what the event-driven
            simulation loop actually pops and resolves, distinct from the
            entities it concerns (see involved_entity) and from its own
            place in its lifecycle (see event_state, a separate component
            so a lifecycle transition never has to restate start_time/
            duration in the same row). Due once world time reaches
            start_time + duration. Not time_dimension'd -- unlike
            event_state, start_time/duration are set once, the same way
            object.type is, not restated over an event's life.
        - component_type
        - field:
            start_time:
                description: World time (seconds since world creation)
                    this event begins. Nullable -- an event not yet
                    scheduled (event_state "not started") may not have
                    one yet.
                type: float
                nullable: true
                units: seconds
            duration:
                description: How long this event takes, in seconds, once
                    it starts. Nullable for the same reason as start_time.
                type: float
                nullable: true
                units: seconds
    event_state:
        - description: >
            An event's own place in its lifecycle, split out from `event`
            itself so a transition doesn't require restating start_time/
            duration. Vocabulary matches iacs's own task.execution_state
            (github.com/zhafen/iacs, iacs/builtins/components.yaml), extended
            there with "planned" and "interrupted" for this project's
            purposes.
        - component_type
        - field:
            value:
                description: This event's current lifecycle state.
                type: str
                range:
                    - not started
                    - planned
                    - in progress
                    - interrupted
                    - complete
            time:
                description: World time (seconds since world creation)
                    this event_state row was recorded at, backfilled on
                    merge, not authored directly, so it stays nullable
                    for hand-authored rows. An event accumulates a new
                    row each time its lifecycle state changes; flagged
                    time_dimension so Registry.view_current resolves the
                    row with the highest time as the event's current
                    lifecycle state.
                type: float
                nullable: true
                time_dimension: true
                units: seconds
    involved_entity:
        - description: >
            Marks that the owning event involves the entity referenced by
            value -- who or what it concerns, acts on, or needs in order
            to be interpreted. An event can carry several
            involved_entity rows, one per entity it involves.
        - parent: directed_relation
        - field:
            value:
                description: The entity this event involves.
                type: entity_ref
    outcome:
        - description: >
            What actually happened once an event resolved: a
            natural-language description, plus how far that leaves the
            event's own lifecycle. progress uses the same vocabulary as
            event_state -- see there.
        - component_type
        - field:
            progress:
                description: How far this outcome leaves the event's own
                    lifecycle. Defaults to "complete" -- most outcomes
                    fully resolve the event they belong to.
                type: str
                range:
                    - not started
                    - planned
                    - in progress
                    - interrupted
                    - complete
                default: complete
            value:
                description: A natural-language description of what happened.
                type: str
    world_clock:
        - description: >
            The simulation's persisted "now" -- world time (seconds since
            world creation), the same axis every time_dimension'd field
            (event_state.time, position.time, state.time, location.time)
            is measured on. Written once per event pop, on a single
            well-known entity (see story_simulator.core.process_event/
            advance_clock), not scoped to any one MCP session -- so it
            survives an MCP disconnect/reconnect the same way every other
            piece of world state already does.

            Not itself time_dimension'd: a row's own value IS the world
            time, so there's no independent "when was this recorded" axis
            to backfill it against -- reading it takes the highest
            recorded value across every row instead (see
            story_simulator.core._next_time_stamp), relying on world time
            only ever moving forward rather than on write order.
        - component_type
        - field:
            value:
                description: World time (seconds since world creation) as
                    of the most recently popped event's own end_time.
                type: float
                units: seconds
    pending_resolution:
        - description: >
            Internal bookkeeping for a turn paused mid-resolution, keyed to
            the paused event's own alias: the exact judgment-call answers
            given so far, plus whether the most recent pause was a
            keyed_subagent budget check-in (its own reply is discarded on
            resume) rather than a genuine judgment call. Written and read
            only by story_simulator.core's resume_token plumbing
            (_save_pending/_load_pending) -- a paused turn's `resume_token`
            is now just that event's own alias, not an encoded payload, so
            this is what a client round-trips back instead. Not narrative
            world state, and not meant to be read or written by a
            connected agent.
        - component_type
        - field:
            answers:
                description: JSON-encoded list of this paused turn's
                    judgment-call answers so far, in call order.
                type: str
            is_checkpoint:
                description: Whether the most recent pause was a
                    keyed_subagent budget check-in rather than a real
                    judgment call needing the connected host's actual decision.
                type: bool
            time:
                description: World time this checkpoint was recorded at,
                    backfilled on merge like state.time/event_state.time,
                    not authored directly. Ties (the common case here,
                    since world time doesn't advance between checkpoints of
                    the same still-unresolved event) are broken by write
                    order -- see Registry's own _seq_ column.
                type: float
                nullable: true
                time_dimension: true
                units: seconds
