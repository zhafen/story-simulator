character:
    - description: Base component for character data.
    - component_type
    - field:
        interaction_type:
            description: Who controls the character.
            type: str
            range:
                - player
                - npc

object:
    - description: Base component for inanimate objects.
    - component_type
    - field:
        type:
            description: The type of object, e.g. "door".
            type: str

appearance:
    - description: A component used to describe the appearance of an entity.
    - component_type
    - field:
        description:
            description: A description of the appearance.
            type: str

physics_components:
    position:
        - description: Component containing the position of an entity.
        - component_type
        - field:
            x:
                description: X position in meters, relative to the origin. On a standard
                    map, x would be east (positive) and west (negative).
                type: float
                nullable: false
            y:
                description: Y position in meters, relative to the origin. On a standard
                    map, y would be north (positive) and south (negative).
                type: float
                nullable: false
            z:
                description: Z position in meters, relative to the origin. On a standard map, z would be out of the map/up (positive) and into the map/down (negative).
                type: float
                nullable: false
                default: 0
            turn:
                description: The turn counter this position was recorded on. Stamped
                    automatically when the value is merged in (see
                    story_simulator.systems._merge_yaml_string), not authored
                    directly, so it stays nullable for rows loaded without one
                    (e.g. hand-authored save files). Entities can accumulate
                    multiple position rows over time; flagged time_dimension so
                    Registry.view_current resolves the row with the highest
                    turn as the current position.
                type: int
                nullable: true
                time_dimension: true
    origin:
        - description: A tag component indicating that the associated entity is at the
            origin of the coordinate system.
        - component_type

character_components:
    memory:
        - description: >
            Marks that the owning character has perceived, and now
            remembers, the entity referenced by value. Written by MapSystem
            alongside `active` whenever an entity is computed active for a
            character (see manifest field docs on `active`) but, unlike
            `active`, never removed once written — a character's memory only
            grows. Scopes what an NPC's decision-making agent (see
            NPCAgentSystem) is told about, as opposed to the Resolver, which
            narrates from every known entity regardless of memory.
        - parent: directed_relation
        - field:
            value:
                description: The entity this character remembers.
                type: entity_ref
    agenda:
        - description: >
            A freeform statement of what the owning character wants to do or
            achieve. Read by NPCAgentSystem to prompt that character's
            decision-making agent for its command each turn. Player
            characters don't need one, since a human supplies their commands
            directly.
        - parent: str
        - field:
            value:
                description: The agenda text.
                type: str

turn_components:
    input:
        - description: A turn's raw text, owned by the acting character's own
            entity — either that character's command or the Resolver's
            narrated reply to it, distinguished by `type`. Written by
            InputSystem (a human player's typed command)/NPCAgentSystem (an
            NPC's agent-decided command)/ResolverAgentSystem, and read back
            by ResolverAgentSystem/ArchivistAgentSystem instead of being
            passed between them directly.
        - component_type
        - field:
            text:
                description: The turn's raw text.
                type: str
                nullable: false
            type:
                description: >
                    Whether this row is a command (a character's action for
                    the turn — "player" regardless of whether a human typed
                    it or NPCAgentSystem generated it) or the Resolver's
                    narrated reply ("agent").
                type: str
                nullable: false
                range:
                    - player
                    - agent
            turn:
                description: The turn counter this input was produced on.
                type: int
                nullable: false
    active:
        - description: Tag component marking an entity as active (within radius of
            the player) for the current turn. Written directly onto each active
            entity by MapSystem, and removed once the entity falls out of range.
        - component_type

agent_components:
    agent:
        - description: >
            Reserved for a future EC-defined agent: an entity with this
            component would describe an agent (Resolver, Terrain, Physics,
            or a world-author's own) the same way `story_simulator.agents.AgentSpec`
            does today from a `*.yaml` file — not read by any code yet. Not
            wired to anything in story_simulator; adding a loader that turns
            an `agent` entity into an `AgentSpec` is future work this
            reservation exists to keep open, not something this component
            type does on its own.

            `tools` isn't represented here yet: a scalar field can't hold a
            list of tool names the way `AgentSpec.tools` can, so an agent's
            tool list will likely need a relation-style component instead
            (mirroring how `memory` is a `directed_relation` to other
            entities, rather than a field on `character`) — left as an open
            question for whenever this reservation gets built out.
        - component_type
        - field:
            role:
                description: >
                    What this agent is for (e.g. "resolver", "terrain",
                    "physics", or a world-author's own label) — informational
                    only until something reads `agent` entities.
                type: str
            model:
                description: A LiteLLM model string, e.g. "claude-opus-4-8" or "gpt-4.1".
                type: str
            system_prompt:
                description: The agent's system prompt.
                type: str
