character:
    - description: Base component for character data.
    - component_type
    - field:
        interaction_type:
            description: Who controls the character.
            type: str
            range:
                - player
                - npc

object:
    - description: Base component for inanimate objects.
    - component_type
    - field:
        type:
            description: The type of object, e.g. "door".
            type: str

appearance:
    - description: A component used to describe the appearance of an entity.
    - component_type
    - field:
        description:
            description: A description of the appearance.
            type: str

physics_components:
    position:
        - description: Component containing the position of an entity.
        - component_type
        - field:
            x:
                description: X position in meters, relative to the origin. On a standard
                    map, x would be east (positive) and west (negative).
                type: float
                nullable: false
            y:
                description: Y position in meters, relative to the origin. On a standard
                    map, y would be north (positive) and south (negative).
                type: float
                nullable: false
            z:
                description: Z position in meters, relative to the origin. On a standard map, z would be out of the map/up (positive) and into the map/down (negative).
                type: float
                nullable: false
                default: 0
            turn:
                description: The turn counter this position was recorded on. Stamped
                    automatically when the value is merged in (see
                    story_simulator.systems._merge_yaml_string), not authored
                    directly, so it stays nullable for rows loaded without one
                    (e.g. hand-authored save files). Entities can accumulate
                    multiple position rows over time; flagged time_dimension so
                    Registry.view_current resolves the row with the highest
                    turn as the current position.
                type: int
                nullable: true
                time_dimension: true
    origin:
        - description: A tag component indicating that the associated entity is at the
            origin of the coordinate system.
        - component_type
    size:
        - description: The entity's characteristic visible dimension, in meters (e.g.
            height for a person or door). Drives how far away `perceive`
            (story_simulator/spatial.py) considers the entity perceptible --
            see `story_simulator.game_config` for the visibility-distance
            calculation. An entity with no `size` component of its own falls
            back to `game_config.DEFAULT_ENTITY_SIZE`.
        - component_type
        - field:
            value:
                description: The size in meters.
                type: float

character_components:
    memory:
        - description: >
            Marks that the owning character has perceived, and now
            remembers, the entity referenced by value. Written by the
            `perceive` MCP tool (`story_simulator/spatial.py`) alongside
            `active` whenever an entity is computed nearby a character (see
            manifest field docs on `active`) but, unlike `active`, never
            removed once written — a character's memory only grows. Scopes
            what `advance_npc_turn` tells that NPC's decision-making call
            about, as opposed to a connected agent narrating a human
            player's turn, which can look up any known entity regardless of
            memory via `view_registry`/`view_entity`.
        - parent: directed_relation
        - field:
            value:
                description: The entity this character remembers.
                type: entity_ref
    agenda:
        - description: >
            A freeform statement of what the owning character wants to do or
            achieve. Read by `advance_npc_turn` to prompt that character's
            decision-making call for its action each turn. Player characters
            don't need one, since a human (via the connected agent) decides
            their actions directly.
        - parent: str
        - field:
            value:
                description: The agenda text.
                type: str

turn_components:
    active:
        - description: Tag component marking an entity as currently perceived by
            whichever character `perceive` was last called for. Written
            directly onto each nearby entity by the `perceive` MCP tool
            (`story_simulator/spatial.py`), and removed once the entity
            falls out of range on the next `perceive` call.
        - component_type

agent_components:
    agent:
        - description: >
            Reserved for a future EC-defined agent: an entity with this
            component would describe an agent (Terrain, Physics, an NPC's
            own decision-maker, or a world-author's own) the same way
            `story_simulator.agents.AgentSpec` does today from a `*.yaml`
            file — not read by any code yet. Not wired to anything in
            story_simulator; adding a loader that turns an `agent` entity
            into an `AgentSpec`, and something that dispatches to it from an
            MCP tool, is future work this reservation exists to keep open,
            not something this component type does on its own.

            `tools` isn't represented here: an MCP-exposed agent's tools are
            whatever its own tool handler code calls, not something this
            component needs to declare — see docs/architecture.md.
        - component_type
        - field:
            role:
                description: >
                    What this agent is for (e.g. "terrain", "physics", or a
                    world-author's own label) — informational only until
                    something reads `agent` entities.
                type: str
            model:
                description: A LiteLLM model string, e.g. "claude-opus-4-8" or "gpt-4.1".
                type: str
            system_prompt:
                description: The agent's system prompt.
                type: str
