character:
    - description: Base component for character data.
    - component_type
    - field:
        interaction_type:
            description: Who controls the character.
            type: str
            range:
                - player
                - npc

object:
    - description: Base component for inanimate objects.
    - component_type
    - field:
        type:
            description: The type of object, e.g. "door".
            type: str

appearance:
    - description: A component used to describe the appearance of an entity.
    - component_type
    - field:
        description:
            description: A description of the appearance.
            type: str

state:
    - description: The entity's current state, as a single freeform word or short
        phrase (e.g. a door being "open" or "closed"). Exactly one value counts
        as current per entity -- see `time`.
    - component_type
    - field:
        value:
            description: The current state, e.g. "open" or "closed".
            type: str
        time:
            description: World time (seconds since world creation) this state
                was recorded at, backfilled on merge (see
                story_simulator.core._next_time_stamp), not authored
                directly, so it stays nullable for hand-authored rows.
                Entities can accumulate multiple state rows over time;
                flagged time_dimension so Registry.view_current resolves
                the row with the highest time as the current state.
            type: float
            nullable: true
            time_dimension: true
            units: seconds

location:
    - description: The entity's current location, as a short freeform phrase
        (e.g. "parked in parking_spot_1" or "parked on street") rather than
        spatial coordinates -- see `position` for that. Exactly one value
        counts as current per entity -- see `time`.
    - component_type
    - field:
        value:
            description: The current location, e.g. "parked on street".
            type: str
        time:
            description: World time (seconds since world creation) this
                location was recorded at, backfilled on merge (see
                story_simulator.core._next_time_stamp), not authored
                directly, so it stays nullable for hand-authored rows.
                Entities can accumulate multiple location rows over time;
                flagged time_dimension so Registry.view_current resolves
                the row with the highest time as the current location.
            type: float
            nullable: true
            time_dimension: true
            units: seconds

race_placement:
    - description: A car's finishing position in a race (1 = first to finish,
        2 = second, etc.), recorded once its own trip event resolves. Exactly
        one value counts as current per entity -- see `time`, matching
        state's/location's pattern.
    - component_type
    - field:
        value:
            description: 1-indexed finishing position, e.g. 1 for first place.
            type: int
        time:
            description: World time (seconds since world creation) this
                placement was recorded at, backfilled on merge (see
                story_simulator.core._next_time_stamp), not authored
                directly, so it stays nullable for hand-authored rows.
                Entities can accumulate multiple race_placement rows over
                time; flagged time_dimension so Registry.view_current
                resolves the row with the highest time as the current
                placement.
            type: float
            nullable: true
            time_dimension: true
            units: seconds

write_accuracy_trial:
    - description: >
        One measured batch of live-test reps for a single approach in
        #73's comparative write-accuracy harness
        (tests/location_write_harness.py) -- actual numbers, not prose,
        so a batch's results can be queried like any other EC data
        instead of only living in a printed harness summary. Not
        time_dimension'd: each trial gets its own dedicated entity rather
        than accumulating multiple rows on a shared one, since a rerun of
        the same approach is a distinct, separately-reportable batch, not
        a correction of the previous one.
    - component_type
    - field:
        approach:
            description: Which approach was tested (e.g. baseline, confirm,
                consolidate -- see location_write_harness.py's _APPROACHES).
            type: str
        model:
            description: claude -p --model value used for this batch (e.g.
                claude-haiku-4-5-20251001).
            type: str
        reps:
            description: Number of reps in this batch.
            type: int
        successes:
            description: Number of reps that passed.
            type: int
        total_cost_usd:
            description: Total measured cost (HeadlessSession.usage_summary's
                total_cost_usd, summed) across the batch.
            type: float

physics_components:
    position:
        - description: Component containing the position of an entity.
        - component_type
        - field:
            x:
                description: X position in meters, relative to the origin. On a standard
                    map, x would be east (positive) and west (negative).
                type: float
                nullable: false
            y:
                description: Y position in meters, relative to the origin. On a standard
                    map, y would be north (positive) and south (negative).
                type: float
                nullable: false
            z:
                description: Z position in meters, relative to the origin. On a standard map, z would be out of the map/up (positive) and into the map/down (negative).
                type: float
                nullable: false
                default: 0
            time:
                description: World time (seconds since world creation) this
                    position was recorded at, backfilled on merge (see
                    story_simulator.core._next_time_stamp), not authored
                    directly, so it stays nullable for hand-authored rows.
                    Entities can accumulate multiple position rows over time;
                    flagged time_dimension so Registry.view_current resolves
                    the row with the highest time as the current position.
                type: float
                nullable: true
                time_dimension: true
                units: seconds
    origin:
        - description: A tag component indicating that the associated entity is at the
            origin of the coordinate system.
        - component_type
    size:
        - description: The entity's characteristic visible dimension, in meters (e.g.
            height for a person or door). Drives how far away `perceive`
            (story_simulator/spatial.py) considers the entity perceptible --
            see `story_simulator.game_config` for the visibility-distance
            calculation. An entity with no `size` component of its own falls
            back to `game_config.DEFAULT_ENTITY_SIZE`.
        - component_type
        - field:
            value:
                description: The size in meters.
                type: float

character_components:
    memory:
        - description: >
            Marks that the owning character has perceived, and now
            remembers, the entity referenced by value. Written by `perceive`
            alongside `active`, but unlike `active`, never removed once
            written — a character's memory only grows. Scopes what
            `advance_npc_turn` tells that NPC's decision-making call about.
        - parent: directed_relation
        - field:
            value:
                description: The entity this character remembers.
                type: entity_ref
    agenda:
        - description: >
            A freeform statement of what the owning character wants to do or
            achieve. Read by `advance_npc_turn` to prompt that character's
            decision-making call each turn. Player characters don't need one.
        - parent: str
        - field:
            value:
                description: The agenda text.
                type: str

turn_components:
    active:
        - description: Tag component marking an entity as currently perceived by
            whichever character `perceive` was last called for. Replaced
            wholesale on each `perceive` call to match its current result set.
        - component_type

event_components:
    event:
        - description: >
            A scheduled or ongoing occurrence -- what the event-driven
            simulation loop actually pops and resolves, distinct from the
            entities it concerns (see involved_entity) and from its own
            place in its lifecycle (see event_state, a separate component
            so a lifecycle transition never has to restate start_time/
            duration in the same row). Due once world time reaches
            start_time + duration. Not time_dimension'd -- unlike
            event_state, start_time/duration are set once, the same way
            object.type is, not restated over an event's life.
        - component_type
        - field:
            start_time:
                description: World time (seconds since world creation)
                    this event begins. Nullable -- an event not yet
                    scheduled (event_state "not started") may not have
                    one yet.
                type: float
                nullable: true
                units: seconds
            duration:
                description: How long this event takes, in seconds, once
                    it starts. Nullable for the same reason as start_time.
                type: float
                nullable: true
                units: seconds
    event_state:
        - description: >
            An event's own place in its lifecycle, split out from `event`
            itself so a transition doesn't require restating start_time/
            duration. Vocabulary matches iacs's own task.execution_state
            (iacs/iacs/builtins/components.yaml), extended there with
            "planned" and "interrupted" for this project's purposes.
        - component_type
        - field:
            value:
                description: This event's current lifecycle state.
                type: str
                range:
                    - not started
                    - planned
                    - in progress
                    - interrupted
                    - complete
            time:
                description: World time (seconds since world creation)
                    this event_state row was recorded at, backfilled on
                    merge, not authored directly, so it stays nullable
                    for hand-authored rows. An event accumulates a new
                    row each time its lifecycle state changes; flagged
                    time_dimension so Registry.view_current resolves the
                    row with the highest time as the event's current
                    lifecycle state.
                type: float
                nullable: true
                time_dimension: true
                units: seconds
    involved_entity:
        - description: >
            Marks that the owning event involves the entity referenced by
            value -- who or what it concerns, acts on, or needs in order
            to be interpreted. An event can carry several
            involved_entity rows, one per entity it involves.
        - parent: directed_relation
        - field:
            value:
                description: The entity this event involves.
                type: entity_ref
    outcome:
        - description: >
            What actually happened once an event resolved: a
            natural-language description, plus how far that leaves the
            event's own lifecycle. progress uses the same vocabulary as
            event_state -- see there.
        - component_type
        - field:
            progress:
                description: How far this outcome leaves the event's own
                    lifecycle. Defaults to "complete" -- most outcomes
                    fully resolve the event they belong to.
                type: str
                range:
                    - not started
                    - planned
                    - in progress
                    - interrupted
                    - complete
                default: complete
            value:
                description: A natural-language description of what happened.
                type: str

agent_components:
    agent:
        - description: >
            Reserved for a future EC-defined agent: an entity with this
            component would describe an agent (Terrain, Physics, an NPC's
            own decision-maker, or a world-author's own) the same way
            `story_simulator.agents.AgentSpec` does today from a `*.yaml`
            file. Not read by any code yet — see
            docs/manifest/story-simulator.yaml: story_simulator_mission.ec_defined_agents.
        - component_type
        - field:
            role:
                description: What this agent is for (e.g. "terrain", "physics").
                type: str
            model:
                description: A LiteLLM model string, e.g. "claude-opus-4-8" or "gpt-4.1".
                type: str
            system_prompt:
                description: The agent's system prompt.
                type: str
