[project]
name = "story-simulator"
version = "0.1.0"
description = "Story simulator"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40.0",
]

[project.scripts]
ask-agent = "story_simulator.agent:main"
world-soul = "story_simulator.world_soul:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["story_simulator*"]
