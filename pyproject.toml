[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "story-simulator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "iacs",
    "litellm>=1.60.0",
    "matplotlib>=3.11.0",
    "mcp>=1.28.1",
    "psycopg[binary]>=3.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
story-simulator-mcp = "story_simulator.mcp_server:main"

[tool.uv.sources]
iacs = { path = "iacs", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["story_simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call the real Anthropic API (require ANTHROPIC_API_KEY, cost money, excluded from CI)",
]
