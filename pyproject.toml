[project]
name = "story-simulator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
    "iacs",
    "litellm>=1.60.0",
    "matplotlib>=3.11.0",
    "mcp>=1.28.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
iacs = { path = "iacs", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call the real Anthropic API (require ANTHROPIC_API_KEY, cost money, excluded from CI)",
]
