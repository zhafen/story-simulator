file_info:
    - description: >
        Isolation fixture for tests/test_arrival_order_live.py -- same
        start_time/duration facts as tests/data/scenarios/parking/scenario.yaml
        (so end_times, and therefore the correct arrival order, match exactly),
        but with no restaurant, no parking spots, and no consequence riding on
        the answer at all. Tests whether a weak model reasons about *arrival
        order* correctly in isolation, separate from whether it also picks the
        right component to write a resulting location to.

car_a:
    - object:
        type: car
    - description:
        value: The car for friend A.

car_a_trip:
    - event:
        start_time: 0
        duration: 1800
    - event_state:
        value: planned
    - involved_entity:
        - value: car_a
    - description:
        value: car_a's drive.

