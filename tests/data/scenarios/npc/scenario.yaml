file_info:
    - description: >
        This file is for testing npc behavior. The expected pattern is for the npc to
        go to the door and open it, and maybe explore further.

# Aliased "traveler", not "npc": same_as resolution (iacs's resolve_same_as)
# matches candidates by substring against each entity's full
# "{filepath}:{yaml_path}" path, and pytest's tmp_path for this fixture's own
# test embeds the test function's name (e.g. ".../test_npc0/...") — an alias
# of "npc" would then substring-match every entity's path, not just this
# one's, and same_as resolution would raise on the ambiguity.
traveler:
    - character:
        interaction_type: npc
    - position:
        x: 0
        y: 0
    - description:
        value: A traveler, pausing at the edge of a quiet space.
    - agenda: If I see anywhere I haven't explored yet, I want to go there.

door:
    - object:
        type: door
    - origin
    - position:
        x: 0
        y: 2
    - description:
        value: A plain door; what's on its far side isn't visible yet.

expanse:
    - object:
        type: expanse
    - position:
        x: 0
        y: 0
    - description:
        value: An empty, quiet space, without walls or horizon.
