file_info:
    - description: >
        Regression fixture shared by tests/test_car_parking_deterministic.py
        and tests/test_human_validated/test_write_accuracy.py. Three cars
        drive to a restaurant with only two parking spots.

restaurant:
    - object:
        type: restaurant
    - description:
        value: >
            A small restaurant with exactly two dedicated parking spots,
            parking_spot_1 and parking_spot_2; anyone who misses both has
            to park on the street instead. First-come, first-served:
            whoever actually arrives first takes parking_spot_1, the next
            takes parking_spot_2.

parking_spot_1:
    - object:
        type: parking_spot
    - description:
        value: The first of the restaurant's two dedicated parking spots.

parking_spot_2:
    - object:
        type: parking_spot
    - description:
        value: The second of the restaurant's two dedicated parking spots.

street:
    - object:
        type: street
    - description:
        value: Ordinary street parking near the restaurant.

car_a:
    - object:
        type: car
    - description:
        value: The car for friend A.

car_a_trip:
    - event:
        start_time: 0
        duration: 1800
    - event_state:
        value: planned
    - involved_entity:
        - value: car_a
        - value: restaurant
    - description:
        value: car_a's drive to restaurant and search for parking.

car_b:
    - object:
        type: car
    - description:
        value: The car for friend B.

car_b_trip:
    - event:
        start_time: 300
        duration: 720
    - event_state:
        value: planned
    - involved_entity:
        - value: car_b
        - value: restaurant
    - description:
        value: car_b's drive to restaurant and search for parking.

car_c:
    - object:
        type: car
    - description:
        value: The car for friend C.

car_c_trip:
    - event:
        start_time: 480
        duration: 600
    - event_state:
        value: planned
    - involved_entity:
        - value: car_c
        - value: restaurant
    - description:
        value: car_c's drive to restaurant and search for parking.
