file_info:
    - description: >
        Human-validated regression fixture for tests/test_human_validated.py::
        test_car_parking_reasoning. Three cars drive to a restaurant with only two
        parking spots.

drive:
    - description: >
        How long a trip takes and when it starts.
    - component_type
    - field:
        duration:
            description: How long this drive takes once it starts, in seconds.
            type: float
            units: seconds
        traveler:
            description: The entity making this trip.
            type: entity_ref
        destination:
            description: Where this trip is going.
            type: entity_ref

restaurant:
    - object:
        type: restaurant
    - place
    - description:
        value: >
            A small restaurant with exactly two dedicated parking spots,
            parking_spot_1 and parking_spot_2; anyone who misses both has
            to park on the street instead.

parking_spot_1:
    - object:
        type: parking_spot
    - place
    - description:
        value: The first of the restaurant's two dedicated parking spots.

parking_spot_2:
    - object:
        type: parking_spot
    - place
    - description:
        value: The second of the restaurant's two dedicated parking spots.

street:
    - object:
        type: street
    - location
    - description:
        value: >
            Ordinary street parking near the restaurant, for anyone who
            arrives after both dedicated spots are already taken.

car_a:
    - object:
        type: car
    - next_due:
        value: 0
    - description: The car for friend A.

car_a_drive:
    - description:
        value: car_a's own drive to restaurant -- starts_at/duration are in seconds.
    - drive:
        starts_at: 0
        duration: 1800
        traveler: car_a
        destination: restaurant

car_b:
    - object:
        type: car
    - next_due:
        value: 300
    - description: The car for friend B.

car_b_drive:
    - drive:
        starts_at: 300
        duration: 720
        traveler: car_b
        destination: restaurant
    - description:
        value: car_b's own drive to restaurant -- starts_at/duration are in seconds.

car_c:
    - object:
        type: car
    - next_due:
        value: 480
    - description: The car for friend B.

car_c_drive:
    - drive:
        starts_at: 480
        duration: 600
        traveler: car_c
        destination: restaurant
    - description:
        value: car_c's own drive to restaurant -- starts_at/duration are in seconds.
