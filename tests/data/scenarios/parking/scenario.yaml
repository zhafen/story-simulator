file_info:
    - description: >
        Human-validated regression fixture for tests/test_human_validated.py::
        test_car_parking_reasoning (currently skipped -- see that test's
        docstring). Three cars drive to a restaurant with only two parking
        spots. Their start times and trip lengths are deliberately chosen
        so that neither "started first" nor "shortest drive" predicts who
        actually arrives first -- working out the correct arrival order
        takes real start_time + trip_duration arithmetic:

            Car A: starts at elapsed 0 min, drive takes 30 min -> arrives at 30 min.
            Car B: starts at elapsed 5 min, drive takes 12 min -> arrives at 17 min.
            Car C: starts at elapsed 8 min, drive takes 10 min -> arrives at 18 min.

        So the real arrival order is B, then C, then A -- despite A
        starting first (it still arrives last) and despite B's drive
        taking longer than C's (it still arrives first, because it left
        earlier by more than the difference in drive time). First-come,
        first-served for the restaurant's two dedicated spots: Car B gets
        parking_spot_1, Car C gets parking_spot_2, and Car A -- arriving
        after both are already taken -- has to park on the street instead.

        Written for the current base event loop (no character/NPC module
        -- see docs/architecture.md and CLAUDE.md): these are plain
        entities, not characters, and nothing perceives or narrates to
        them automatically. Each car's own `next_due` below is seeded to
        its start time (in seconds), not its arrival time, so
        advance_simulation pops them in start order (A, B, C) when it
        asks "what happens now that this entity is due" -- the same order
        a naive "first to start must act first" reading would (wrongly)
        expect to also be the arrival/parking order. The connected agent
        answering each of those "is due" prompts has to actually work
        through the elapsed-time arithmetic in each car's own description
        (via view_entity/view_registry, per the server's own instructions)
        to get the parking assignment right, rather than just reacting to
        whichever order the entities happen to come due in.

        Starting positions are far apart in three different directions,
        as flavor -- the puzzle is intentionally solvable from the stated
        start-time/trip-duration facts alone, with no distance or speed
        (i.e. no physics) involved.

restaurant:
    - object:
        type: restaurant
    - position:
        x: 0
        y: 1000
    - description:
        value: >
            A small restaurant with exactly two dedicated parking spots
            out front; anyone who misses both has to park on the street
            instead.

parking_spot_1:
    - object:
        type: parking_spot
    - position:
        x: -2
        y: 998
    - description:
        value: The first of the restaurant's two dedicated parking spots.

parking_spot_2:
    - object:
        type: parking_spot
    - position:
        x: 2
        y: 998
    - description:
        value: The second of the restaurant's two dedicated parking spots.

street:
    - object:
        type: street
    - position:
        x: -30
        y: 990
    - description:
        value: >
            Ordinary street parking a short walk from the restaurant, for
            anyone who arrives after both dedicated spots are already taken.

car_a:
    - object:
        type: car
    - position:
        x: -5000
        y: 1000
    - next_due:
        value: 0
    - description:
        value: >
            One of three friends' cars driving separately to restaurant
            for dinner tonight. It has only two dedicated parking spots,
            parking_spot_1 and parking_spot_2; whichever of the three cars
            actually arrives there first takes parking_spot_1, whichever
            arrives second takes parking_spot_2, and whichever arrives
            last has to park on street instead.

            Here's what's known about tonight's trip for all three cars:
            car_a starts driving immediately (elapsed time zero), and its
            drive takes 30 minutes. car_b starts driving 5 minutes after
            car_a, and its drive takes 12 minutes. car_c starts driving 8
            minutes after car_a, and its drive takes 10 minutes.

            This is car_a. Work out the actual order the three cars
            arrive in -- starting earlier doesn't mean arriving earlier,
            and a shorter drive doesn't always mean arriving earlier
            either -- then decide where car_a ends up parking accordingly.

