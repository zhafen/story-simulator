file_info:
    - description: >
        Permanent regression fixture for tests/test_race_placement_live.py
        (task #57: the recurring bug where a weak model assumes a
        different, not-yet-resolved car's trip has already finished).
        Reuses the parking scenario's exact start_time/duration facts (so
        end_times, and therefore the correct finishing order, match
        exactly: car_b=1020, car_c=1080, car_a=1800) but frames it as a
        three-car race with no restaurant/parking-spot consequence riding
        on the answer at all -- there is nothing to reason about except
        finishing order, recorded via each car's own race_placement.value.

car_a:
    - object:
        type: car
    - description:
        value: The car for friend A, competing in the race.

car_a_trip:
    - event:
        start_time: 0
        duration: 1800
    - event_state:
        value: planned
    - involved_entity:
        - value: car_a
    - description:
        value: car_a's leg of the race.

car_b:
    - object:
        type: car
    - description:
        value: The car for friend B, competing in the race.

car_b_trip:
    - event:
        start_time: 300
        duration: 720
    - event_state:
        value: planned
    - involved_entity:
        - value: car_b
    - description:
        value: car_b's leg of the race.

car_c:
    - object:
        type: car
    - description:
        value: The car for friend C, competing in the race.

car_c_trip:
    - event:
        start_time: 480
        duration: 600
    - event_state:
        value: planned
    - involved_entity:
        - value: car_c
    - description:
        value: car_c's leg of the race.
