file_info:
    - description: >
        Structural regression fixture for
        tests/test_human_validated/test_parking_split_live.py
        (task #65, investigating #57). Splits tests/data/scenarios/parking/
        scenario.yaml's single combined "trip" event (driving + parking
        bundled into one resolution) into two separate, pre-planned events
        per car: a driving event (ends on arrival) and a parking event
        (spot assignment). Reuses the exact same start_time/duration facts
        for each car's driving leg as the parking scenario, so arrival
        order is identical (car_b arrives at 1020, car_c at 1080, car_a at
        1800); each car's parking event is pre-planned to start the moment
        its own driving event ends, with a short fixed 10-second duration,
        so pop_event's own mechanical sort (soonest end_time first) still
        resolves everything in the intended order: car_b drives, car_b
        parks, car_c drives, car_c parks, car_a drives, car_a parks --
        never a driving and a parking event tied at the same end_time.
        Tests whether first-come-first-served parking still comes out
        right once driving and parking are no longer bundled into one
        event's resolution.

restaurant:
    - object:
        type: restaurant
    - description:
        value: >
            A small restaurant with exactly two dedicated parking spots,
            parking_spot_1 and parking_spot_2; anyone who misses both has
            to park on the street instead. First-come, first-served:
            whoever actually arrives first takes parking_spot_1, the next
            takes parking_spot_2.

parking_spot_1:
    - object:
        type: parking_spot
    - description:
        value: The first of the restaurant's two dedicated parking spots.

parking_spot_2:
    - object:
        type: parking_spot
    - description:
        value: The second of the restaurant's two dedicated parking spots.

street:
    - object:
        type: street
    - description:
        value: Ordinary street parking near the restaurant.

car_a:
    - object:
        type: car
    - description:
        value: The car for friend A.

car_a_drive:
    - event:
        start_time: 0
        duration: 1800
    - event_state:
        value: planned
    - involved_entity:
        - value: car_a
        - value: restaurant
    - description:
        value: car_a's drive to the restaurant.

car_a_park:
    - event:
        start_time: 1800
        duration: 10
    - event_state:
        value: planned
    - involved_entity:
        - value: car_a
        - value: restaurant
    - description:
        value: car_a's parking decision, once it has already arrived.

car_b:
    - object:
        type: car
    - description:
        value: The car for friend B.

car_b_drive:
    - event:
        start_time: 300
        duration: 720
    - event_state:
        value: planned
    - involved_entity:
        - value: car_b
        - value: restaurant
    - description:
        value: car_b's drive to the restaurant.

car_b_park:
    - event:
        start_time: 1020
        duration: 10
    - event_state:
        value: planned
    - involved_entity:
        - value: car_b
        - value: restaurant
    - description:
        value: car_b's parking decision, once it has already arrived.

car_c:
    - object:
        type: car
    - description:
        value: The car for friend C.

car_c_drive:
    - event:
        start_time: 480
        duration: 600
    - event_state:
        value: planned
    - involved_entity:
        - value: car_c
        - value: restaurant
    - description:
        value: car_c's drive to the restaurant.

car_c_park:
    - event:
        start_time: 1080
        duration: 10
    - event_state:
        value: planned
    - involved_entity:
        - value: car_c
        - value: restaurant
    - description:
        value: car_c's parking decision, once it has already arrived.
